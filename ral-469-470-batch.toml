# Prior research and interview answers (authoritative)

# RAL-469: Restore CLAUDE.md/AGENTS.md loading for agent backends — Interview Notes

## Self-answered (codebase research)

Q. Where is the Claude Code `--setting-sources` flag constructed, and what value does it pass today?
A. `runner/src/claude_code_backend.rs:248-258` (`setting_sources_args`): when `options.allow_personal_settings` is false (the default for agent-run cells), it returns `vec!["--setting-sources".to_string(), String::new()]` — i.e. `--setting-sources ""`. Per the doc comment at `:347-353`, this literal empty string disables loading settings from ALL three sources (user, project, AND local), not just user/local.

Q. Is this a regression, or has it always been this way?
A. Always been this way. `git log -S"setting-sources" --all` shows the flag was introduced already as `""` in the original RAL-336 "isolate agent config and memory directories" work (commits `2068492d`/`30062192`/`59000003`/`8aae2350`, later folded into batch commits). No prior commit had a non-empty value — this is the isolation feature's original design never distinguishing "project" from "user/local," not a value that regressed.

Q. Do Codex and Pi have an equivalent flag/bug?
A. No. `runner/src/codex_backend.rs:197-223` (`isolated_codex_home`) only redirects `CODEX_HOME` (settings/auth dir) — no flag touches project-directory reads. `runner/src/pi_backend.rs:74-128` only redirects `PI_CODING_AGENT_DIR`, same pattern. Neither backend has an AGENTS.md-loading toggle; both CLIs appear to read the project's instruction file straight from the workspace cwd regardless of home/config-dir isolation — meaning they may already achieve "project-only" behavior by construction, with no equivalent bug to fix.

Q. Where should a Codex/Pi fix live, per repo convention, if one is needed?
A. `AGENTS.md:52-55` + `runner/src/backend.rs:191` (`ModelBackend` trait) confirm one-trait/per-file-impl structure — `claude_code_backend.rs`, `codex_backend.rs`, `pi_backend.rs` each implement it separately. Any backend-specific change belongs solely in that backend's file.

## Interview Q&A

Q1. Given the flag currently disables all three sources, should `--setting-sources` include `"project"` only?
A. Yes, just project.

Q2. Preserve the RAL-336 isolation (project only, no user/local), or was suppressing all three the actual oversight?
A. Preserve it — do NOT include local or user settings. Project settings are OK. **And this should be the target behavior for Claude, Codex, AND Pi** — not just Claude. (Note: research suggests Codex/Pi may already satisfy this by construction via their existing `CODEX_HOME`/`PI_CODING_AGENT_DIR` redirection + direct cwd reads — needs runtime confirmation per Q3, not just code reading.)

Q3. Is it OK for Codex/Pi's acceptance criteria to become "confirmed not affected" rather than a code fix?
A. Only if there's definite confirmation (i.e. an actual runtime test showing project files load and user/local ones don't), not just a conclusion from reading the code.


# RAL-470: Add --skip-tmux flag to build-release scripts

## Summary

`build-release.sh`/`build-release.cmd` currently only support skipping the tmux (2mux) build step via an environment variable. Add a `--skip-tmux` command-line flag to both scripts as the primary way to opt out, so a user can pass it directly instead of having to set an environment variable first.

## Values

A CLI flag is more discoverable and easier to use in one-off invocations than an environment variable — the user doesn't need to remember or look up the variable name, and it's visible in shell history and `--help` output.

## Risks

- Two release-build entry points (`.sh` and `.cmd`) must stay in parity; a flag added to one and not the other reintroduces the inconsistency this ticket is meant to fix.
- Need a decision on whether the existing environment variable is kept as a fallback/deprecated path or removed outright — removing it could break existing CI or user scripts that already set it.

## Acceptance Criteria

- [ ] `build-release.sh --skip-tmux` skips the tmux build step.
- [ ] `build-release.cmd --skip-tmux` (or its PowerShell equivalent) skips the tmux build step.
- [ ] Behavior documented in `scripts/AGENTS.md`.
- [ ] Make sure auto-formatters run, linting passes, and tests pass.

---

# Prior research and interview answers (authoritative)

# RAL-470: Add --skip-tmux flag to build-release scripts — Interview Notes

## Self-answered (codebase research)

Q. Where does the tmux skip mechanism currently live, and what's the exact env var?
A. `scripts/build-release.cmd:42-48` checks `RALPHUS_SKIP_VENDORED_TMUX=="1"`; documented in a comment at `:18-23`. `scripts/build-release.sh` has **no** tmux/psmux logic at all (confirmed by reading the full file) — the skip mechanism is Windows-only today. There's no `build-release.ps1`. The vendored component is called **psmux**, not "2mux" — embedded via the daemon Cargo feature `embedded-tmux`.

Q. Is there existing CLI arg-parsing scaffolding to hook a new flag into?
A. No — neither `build-release.cmd` nor `build-release.sh` parses any arguments today; `--skip-tmux` would be the first flag either script supports. `scripts/build-debug.sh:20,40-56` already has a `while [[ $# -gt 0 ]]` loop supporting `--daemon-port`/`--librarian-port`/`--db-path` (mirrored in `build-debug.cmd`) — a reusable pattern, though not required here.

Q. What does "building tmux/2mux" actually involve?
A. `scripts/build-vendored-tmux.ps1:1-49`: checks out the `vendor/psmux` git submodule, builds its `tmux` binary via `cargo build --release`, copies the resulting `tmux.exe` into `daemon/assets/tmux/windows/tmux.exe`, which `daemon/src/tmux.rs`'s embedded module `include_bytes!`s when the `embedded-tmux` Cargo feature is enabled. Skipping means: no submodule build, no PowerShell script invocation, and the release `cargo build` runs without `--features ralphus-daemon/embedded-tmux`.

Q. Is this documented in `scripts/AGENTS.md`?
A. No — grep for tmux/2mux in `scripts/AGENTS.md` found nothing; needs updating alongside the flag addition.

Q. Do other scripts (build-debug) reference the same env var?
A. No — `build-debug.sh`/`.cmd` never reference `RALPHUS_SKIP_VENDORED_TMUX` or build psmux at all; debug builds apparently never build embedded tmux.

## Interview Q&A

Q1. Since `build-release.sh` has no tmux-build logic today, does this ticket mean add `--skip-tmux` only to `.cmd`, or also port the vendored-tmux build path to `.sh` for parity?
A. The `.cmd` currently has it. `.sh` should have feature parity with `.cmd` — port the vendored-tmux build path to `build-release.sh` too, gated by the same `--skip-tmux` flag. Action item: add a note to the agent-conduct docs to always keep `scripts/*.sh` in parity with `scripts/*.cmd` going forward (general rule, not just for this ticket).

Q2. Should `--skip-tmux` fully replace `RALPHUS_SKIP_VENDORED_TMUX`, or keep the env var as a fallback?
A. Replace entirely — no fallback. `--skip-tmux` becomes the only way to skip the tmux build; the env var check is removed.

Q3. Copy the `build-debug.sh`-style multi-flag arg-parsing loop, or keep it minimal?
A. Minimal is enough — a single-flag check, no need for the fuller parsing loop.

---


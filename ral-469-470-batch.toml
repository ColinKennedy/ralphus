# RAL-469: Restore CLAUDE.md/AGENTS.md loading for agent backends

## Summary

Agent-run cells no longer pick up project-level `CLAUDE.md`/`AGENTS.md` files. The suspected root cause is that Claude Code's `--setting-sources` flag is currently passed empty, which suppresses loading of project-level settings sources; it should include `"project"` so Claude Code reads the project's `CLAUDE.md`. This ticket covers fixing that flag for the Claude Code backend and auditing whether the Codex and Pi backends have an equivalent regression for their own project-instruction files.

## Values

Project-level instructions (build/test/lint rules, architecture notes, agent-conduct rules) are how this repo communicates non-obvious constraints to every agent that works in it. Silently dropping them means agents run without guardrails they were designed to have, producing work that violates documented conventions without any signal that the conventions were never seen.

## Risks

- The flag may be intentionally empty for a reason not yet understood (e.g. to avoid loading user-global settings) — need to confirm `"project"` is the correct value to add rather than a blanket fix.
- Codex and Pi may use entirely different mechanisms (different flag, different file discovery, or none at all) for their own `AGENTS.md`-equivalent — this needs backend-specific investigation, not a copy-paste of the Claude Code fix.
- Per repo convention, backend-specific behavior must live in the concrete Claude Code/Codex/Pi implementations, not in daemon-side lookup tables — a fix that centralizes this logic incorrectly would need to be redone.

## Technical Notes

- Suspected fix location: the `--setting-sources` argument construction for the Claude Code backend; add `"project"` to the currently-empty value.
- Confirm behavior with a real project-level `CLAUDE.md`/`AGENTS.md` present, not just flag presence — an agent could ignore the file even with the correct flag set.

## Acceptance Criteria

- [ ] Claude Code backend cells read project-level `CLAUDE.md` when run.
- [ ] Codex backend confirmed to read (or fixed to read) its project-level instructions file.
- [ ] Pi backend confirmed to read (or fixed to read) its project-level instructions file.
- [ ] Make sure auto-formatters run, linting passes, and tests pass.


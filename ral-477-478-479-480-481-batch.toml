# RAL-480: Track merged review worktree status

## Summary

Add a per-worktree `merged` status to reviews so an individual review worktree can be recorded as already integrated upstream. A merged worktree must remain in the review stack and continue to participate in required rebases, while the system stops attempting to create or update its GitHub pull request or GitLab merge request. Detect and surface this status when upstream has received that worktree's commits, including when stacked changes are merged only partially or individual worktrees are merged serially.

## Values

Supports legitimate partial merges of a review stack without treating the whole review as merged. Prevents review automation from modifying or otherwise interfering with a PR/MR after its worktree has already landed upstream, while preserving stack consistency for remaining work.

## Risks

- Commit-equivalence detection can be complicated by rebases, squash merges, and forge-specific PR/MR state.
- Skipping PR/MR updates must not cause a merged worktree to be omitted from stack rebases or corrupt later review promotion.

## Acceptance Criteria

- [ ] Each review worktree has an independently visible `merged` status; the overall review status is unchanged solely because one worktree is merged.
- [ ] A worktree whose commits are integrated upstream is marked merged, including in a partially merged GitHub PR stack and GitLab MR stack.
- [ ] A merged worktree remains in the linear review stack and participates in subsequent rebases.
- [ ] Automation does not create, update, or otherwise mutate the GitHub PR or GitLab MR associated with a merged worktree.
- [ ] Remaining unmerged worktrees continue their normal PR/MR update and promotion behavior.
- [ ] Auto-formatters run, linting passes, and relevant tests pass.

## Dependencies

- RAL-479 (upstream dependency)

## Technical Notes

- Preserve GitHub/GitLab feature parity and use each provider's REST API directly for forge operations.
- Keep any PR/MR submission and base-resync behavior within the existing linear review PR stack, with regression coverage that proves the stack remains intact.

---

# Prior research and interview answers (authoritative)

# RAL-480 - merged review worktree status

Q. What worktree status is currently displayed?
A. Expanded branches show only the review-worktree path; the review metadata shows only the combined-worktree path. No dedicated worktree status exists. See `librarian/assets/board/65-reviews.js:916` and `librarian/assets/board/65-reviews.js:1026`.

Q. How should merged review worktrees behave and display?
A. A merged worktree stays untouched on disk. It becomes retireable only once its review reaches a terminal state such as merged, cancelled, or closed. Display a new inline `merged` badge on the same row as the Review Worktree, replacing the usual in-progress/failed/done-style worktree badge.

Note: this task is scheduled after RAL-479 lands in this same batch -- use RAL-479's post-rename "merged" review-status vocabulary (not the old "approved" name) when wiring this worktree-level status in.
"""


# RAL-478: Add explicit closed-PR status and surface it everywhere

## Summary

Add an explicit "closed" PR status (distinct from open/merged) for both GitHub and GitLab, and reflect it wherever ralphus currently displays PR badges/state -- including the review detail view (opened by clicking an individual review) and the tasks tab. Both surfaces should receive live updates when a linked PR/MR is closed without merging, not just when it merges.

## Values

Today the UI only distinguishes open vs. merged (or lacks a closed state at all), so a PR that was closed without merging is indistinguishable from one that's still open or was never checked, misleading anyone glancing at the review or task view. An explicit closed status lets users immediately see abandoned/rejected PRs without opening GitHub/GitLab directly.

## Risks

- GitHub and GitLab must stay at feature parity per repo convention -- the closed-state detection and badge must work identically on both providers, using their REST APIs directly (not the `gh`/`glab` CLIs).
- Must distinguish "closed without merge" from "merged" (which typically also reports as closed in the underlying API) -- badge/status logic needs to check the merge flag, not just open/closed.
- Multiple UI surfaces (reviews tab detail view, tasks tab) need to consume the same underlying status source so they don't drift out of sync with each other.
- Badge styling must use documented CSS variables per `docs/colors.md`, not hardcoded colors.
- Polling/refresh timing needs to actually pick up the closed transition promptly -- stale cached PR state would defeat the purpose.

## Acceptance Criteria

- [ ] PR/MR status model includes an explicit "closed" state distinct from "open" and "merged", for both GitHub and GitLab.
- [ ] The review detail view's PR badge reflects "closed" when the linked PR/MR is closed without merging.
- [ ] The tasks tab reflects the same "closed" state for any PR/MR it displays.
- [ ] Closing a PR/MR out-of-band (e.g. directly on GitHub/GitLab) is picked up and reflected in both UI surfaces.
- [ ] Make sure auto-formatters run, linting passes, and tests pass.

---

# Prior research and interview answers (authoritative)

# RAL-478 - closed PR badge/status parity

Q. Does the board retain closed PRs?
A. Yes. The API supports `open`, `merged`, `closed`, and `dropped`; `prCard()` can color all four. But compact branch links and expanded branch PR cards filter to `state === "open"`, so closed PRs disappear from the ordinary branch display. See `librarian/assets/board/00-typedefs.js:388` and `librarian/assets/board/65-reviews.js:644`.

Q. Where should closed PRs appear?
A. The recommended path was approved by non-response: show closed PRs alongside merged PRs both as compact branch badges and in expanded branch cards, retaining their gray lifecycle color and omitting CI status once no longer open.
"""


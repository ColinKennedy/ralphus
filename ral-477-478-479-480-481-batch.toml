prompt                 = """
# RAL-479: Rename review "approved" status to "merged"

## Summary

The review status named "approved" no longer means what it says: before PR integration existed, "approved" simply disabled polling on the review's worktrees. Now, a review auto-transitions to "approved" when its linked PR/MR actually *merges* -- but a PR/MR can also be approved (by a reviewer) without being merged, which the current status can't represent. Remove the "approved" status name and rename that transition/state to "merged" so the ralphus status matches what actually happened.

## Values

Ambiguous status naming makes the review page actively misleading: seeing "approved" implies a human signed off, not that the underlying PR/MR merged. Renaming to "merged" makes the status say exactly what occurred, removing the incongruity between ralphus's review status and the PR/MR's own approved/merged states on GitHub or GitLab.

## Risks

- This is a rename of an existing state, not just a label change -- every place that reads/writes/matches the literal "approved" status (store schema, state machine transitions, CLI/MCP output, board UI, docs) needs to move to "merged" consistently, or the two will drift.
- Existing squads/reviews already persisted with status "approved" need a migration or compatibility mapping so historical data still displays sensibly after the rename.
- Any CLI/MCP command, filter, or automation that currently checks for `approved` as a literal string will silently stop matching if not updated -- needs an audit, not just a search-and-replace in the obvious files.
- Must not conflate ralphus's review-level "merged" status with the PR/MR's own GitHub/GitLab "approved" review-decision state (a reviewer approval) -- the ticket is only about ralphus's own status vocabulary, not importing PR approval state.
- Docs (`docs/glossary.md` and anywhere the "approved" review status is documented) need updating alongside the code per this repo's vocabulary conventions.

## Dependencies

- Related to RAL-478 (explicit closed-PR status) -- both tickets touch how ralphus reflects PR/MR lifecycle state, so consider sequencing/coordinating if worked concurrently.

## Acceptance Criteria

- [ ] The review status previously named "approved" is renamed to "merged" throughout the codebase (store, scheduler/state machine, CLI, MCP, board UI, docs).
- [ ] No remaining code path or UI surface displays or matches the literal string "approved" as a ralphus review status.
- [ ] Existing persisted reviews with the old "approved" status are migrated or mapped correctly to "merged".
- [ ] `docs/glossary.md` and any other status-naming docs are updated to reflect "merged".
- [ ] Make sure auto-formatters run, linting passes, and tests pass.

---

# Prior research and interview answers (authoritative)

# RAL-479 - rename "approved" review status to "merged"

Q. Is `approved` a persisted lifecycle state today?
A. Yes. `GuardianStatus` stores and exposes `approved`; it means human approval, is terminal, and can be reopened. `deployed` is separate. See `daemon/src/guardian.rs:156` and `daemon/src/guardian.rs:4654`.

Q. Is this merely a display-label change?
A. No. This is an end-to-end lifecycle redesign. `merged` must reflect merged PR/review work. `closed` must be a distinct terminal operational stop that halts polling, in-flight agents, and other review-owned deterministic or LLM work without being cancellation. The overloaded `approved` status should be removed everywhere except deliberately retained compatibility boundaries. Closing a review must stop all activity across its PR worktrees.
"""


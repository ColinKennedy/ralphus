# RAL-481: Preserve live terminal scroll across worktrees

## Summary

Prevent the review worktree feedback page from resetting its terminal scroll position to the top when the user changes to another worktree while the live terminal view is open. In particular, a user who has selected Show Live and Jump to Latest must remain at the latest terminal output after switching worktrees, even when new output arrives during the switch.

## Values

Reviewers can move among worktrees without losing their place in an active terminal transcript, making live feedback monitoring dependable and less disruptive.

## Risks

- Terminal-output updates and worktree selection changes may race, so the fix must preserve intentional user scroll positions without suppressing legitimate live updates.

## Acceptance Criteria

- [ ] With a review worktree's live terminal shown, selecting Jump to Latest and then another review worktree does not reset the terminal view to the top.
- [ ] The view remains at the latest output when terminal data arrives while the worktree switch is in progress.
- [ ] Existing intentional scrolling behavior is preserved when the user is not following live output.
- [ ] Auto-formatters run, linting passes, and relevant tests pass.

---

# Prior research and interview answers (authoritative)

# RAL-481 - preserve live terminal scroll

Q. What preservation behavior already exists?
A. The live terminal records scroll position and whether it is at bottom, follows appended output only when already at bottom, preserves the viewport while prepending historical transcript content, and restores scroll after DOM rebuilds. See `librarian/assets/board/35-terminal-logs.js:234`, `:459`, and `:519`.

Q. What remaining failure is being observed?
A. While staying on the same review, clicking from one review worktree/branch to another appears to force the review-detail scroll back to the page top. Preserve the scroll position through that interaction; direct `renderReviewDetail()` calls are a likely cause.
"""


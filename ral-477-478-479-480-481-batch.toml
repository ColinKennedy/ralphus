system_prompt_position = "append"
prompt                 = """
# RAL-477: Collapse review status detail into a one-line summary with a copyable popup

## Summary

On the review board, a cell's status/detail text (e.g. a "feedback failed" error) currently renders inline at full length -- for long failures this dumps the entire raw error, including multi-turn tool/usage noise and pane output, directly into the board layout. Replace this with a single-line, ellipsis-truncated summary in the board view. Clicking the truncated line opens a popup/modal showing the full detail text, with a "copy to clipboard" button so the user can quickly grab the whole error without manually selecting overflowing inline text.

## Values

Long inline error dumps make the review board visually unusable -- a single failing cell can push all other cards out of view and force excessive scrolling. A truncated summary keeps the board scannable, while the popup-with-copy preserves full access to the detail (which the user needs to paste into chat, a ticket, or search) without requiring painful manual text selection from a cramped inline block.

## Risks

- Truncation must pick a sensible cutoff (e.g. first line or first N characters) that still surfaces useful signal (e.g. "feedback failed: agent error: ...") rather than an uninformative fragment.
- The detail text can contain terminal/ANSI control sequences or embedded JSON (`RALPHUS_EVENT:` lines, tool call dumps) -- the popup should render it as plain, selectable text, not attempt to interpret it.
- Needs to work across all the places this status/detail text is rendered on the board (not just the review conflict/failed state shown in the example), so the fix should target the shared rendering path rather than one call site.
- Copy-to-clipboard must have a clear success indicator (e.g. brief "Copied" feedback) so the user isn't left unsure whether the click worked.
- Any color/styling used for the truncated line or popup must use documented CSS variables per `docs/colors.md`, per this repo's UI conventions.

## Acceptance Criteria

- [ ] Review board status/detail text is rendered as a single line, truncated with an ellipsis when it exceeds the available width.
- [ ] Clicking the truncated status line opens a popup showing the full, untruncated detail text.
- [ ] The popup includes a "copy to clipboard" button that copies the full detail text and gives visible confirmation on click.
- [ ] Long detail text (e.g. a multi-KB error with embedded tool output) no longer distorts the board layout.
- [ ] Make sure auto-formatters run, linting passes, and tests pass.

---

# Prior research and interview answers (authoritative)

# RAL-477 - one-line status + copyable error popup

Q. Where do review-branch errors currently appear?
A. An expanded branch renders `detail` as a one-line status row. `branchBadge()` renders generic failure/conflict badges. Auto-submit failures already use the shared copyable failure popup, while ordinary merge failures do not. See `librarian/assets/board/65-reviews.js:505` and `librarian/assets/board/45-details-pane.js:1254`.

Q. Is the intended scope ordinary failed review branches?
A. Yes. Show a short `detail` alongside the `⚠ conflict` badge and make that failure path open the existing copyable failure popup.
"""


Your working directory is a git worktree checked out for this ticket's branch, stacked on top of RAL-289's branch (which fixes proof-restart status resets -- this ticket's own reset semantics for `proof edit` depend on that behavior being correct).

# RAL-290: Add proof edit CLI with agent and model overrides

## Summary

`ralphus proof` currently exposes only `show`, `set-status`, and `restart` --
there is no way to change a proof step's fields once a squad has been
submitted. `ralphus cell edit` already supports `--cwd/--agent/--model/--prompt/--command`
and routes through the daemon's `POST /api/squads/{id}/edit` handler with
`kind: "cell"`. Add a matching `ralphus proof edit` subcommand plus a
`kind: "proof"` branch in `edit_squad`, so a proof step's `model`, `command`,
`prompt`, and `brain` can be edited in place. This ticket also introduces a
per-proof `agent` field on `ProofStep`, which does not exist today -- a proof
step currently has a `model` override but inherits the owning cell's resolved
backend program with no separate backend selector (`core/src/schema.rs:689`).

## Values

Today the only way to correct a wrong model or a typo'd proof command is to
cancel the squad, edit the TOML, and resubmit -- losing all completed cell work
upstream of the proof. Cells already avoid this via `cell edit` + the
downstream-only `restart_cell` reset. Proofs are the last leg of a task and the
most likely place to want a cheap model swap or a tweaked check command, so the
asymmetry costs the most exactly where iteration is most common. Closing it
makes the proof layer as recoverable as the cell layer and removes a class of
full-squad reruns.

## Risks

- Adding `agent` to `ProofStep` is a schema change, not just a CLI gap. It
  affects `core/src/schema.rs`, `core/src/validate.rs` (unknown-key and
  `RESERVED_AGENT_NAMES` handling), the store's proof row, and the daemon's
  resolution path that currently assumes the owning cell's backend.
- The inheritance semantics need a decision: does an unset proof `agent` mean
  "inherit the cell's resolved agent" (current behaviour, must be preserved) and
  does setting it independently of `model` produce a valid backend/model pair?
  A proof pointing at a backend whose allowed model list excludes the inherited
  `model` must be rejected, not silently run.
- Reset scope. `kind: "cell"` deliberately uses `restart_cell`'s
  downstream-only reset rather than the whole-squad reset used by `kind: "task"`
  (see the comment on `edit_squad`, `daemon/src/server.rs:2673`). A proof edit
  needs the narrowest correct equivalent -- likely `restart_proof` from that
  index onward -- and getting it wrong silently re-runs completed agent work.
- The cell path takes the double-dispatch cancellation guard (cancel dirtied
  squads, `wait_for_worker_stop`, then reset) and never holds the daemon lock
  across the wait. The proof path must replicate that ordering or risk a
  worker racing the reset.
- Proof `prompt`/`command`/`brain` are a one-of in the validator. The edit
  handler needs the same "whichever field the caller supplies wins and clears
  the others" rule the cell handler applies to prompt XOR command, extended to
  three fields.
- `machine` on a proof step carries task-level affinity rules (every step under
  one task must agree). If `machine` is added to the editable set, that
  constraint must be re-checked on edit; leaving it out of scope is acceptable.

## Acceptance Criteria

- [ ] `ralphus proof edit <selector>` accepts `--agent`, `--model`, `--command`,
      `--prompt`, and `--brain`, mirroring `ralphus cell edit`'s flag style.
- [ ] `ProofStep` gains an optional `agent` field; when unset, the proof keeps
      inheriting the owning cell's resolved backend exactly as it does today.
- [ ] The validator accepts `agent` as a known proof key and applies the same
      backend-name classification it applies to cell `agent`.
- [ ] `POST /api/squads/{id}/edit` handles `kind: "proof"` and rejects an
      unknown kind with the existing 400 shape.
- [ ] Supplying one of `command`/`prompt`/`brain` clears the other two;
      supplying none leaves all three unchanged.
- [ ] A proof edit resets only that proof step and the ones after it -- upstream
      cells in the same task stay completed and are not re-run.
- [ ] The edit path cancels and waits for affected workers before resetting, and
      does not hold the daemon lock across the wait.
- [ ] `ralphus show help-map` and the manager/reviewer prompt tree list
      `proof edit` with its flags.
- [ ] `docs/daemon-api.md` documents the `kind: "proof"` edit body.
- [ ] Auto-formatters run, linting passes, and tests pass
      (`cargo fmt --all -- --check`, `cargo clippy --all-targets -D warnings`,
      `cargo test --all-targets`).

## Technical Notes

- CLI: `cli-rs/src/commands/proof.rs` -- the `ProofCommand` enum currently has
  only `Show`/`SetStatus`/`Restart`. Model the new `Edit` variant and its
  `Scanner`-based flag parsing on `cli-rs/src/commands/cell.rs`'s `Edit`
  (enum at `:36`, parse at `:92`, dispatch at `:317`).
- Client: `DaemonClient::edit_cell` in `cli-rs/src/client.rs` is the shape to
  follow for an `edit_proof` sibling.
- Daemon: `edit_squad` at `daemon/src/server.rs:2687`; `EditBody` needs the
  proof index and the new fields. The `nullable_field_edit` /
  `non_empty` helpers distinguish "unset" from "clear to null" -- note
  `agent` uses `non_empty` (never nulled) while `model` uses
  `nullable_field_edit` on the cell path; pick deliberately for proof.
- Store: add a `ProofEdit` struct next to `CellEdit` in `daemon/src/store.rs`;
  all SQL stays in that module.
- `RESERVED_AGENT_NAMES` in `core/src/schema.rs` is the shared reserved-name
  set the validator and `daemon/src/agent_profiles.rs` both consume -- a new
  `agent` field should reuse it rather than re-deriving a list.
- Per the logging policy, the edit must emit a stderr line and a structured
  Cartographer row like the cell edit does.

## Out of Scope

- Editing a proof's `machine`, `arguments`, `budget_tokens`,
  `timeout_minutes`, `requires_approval`, or `restart_on`. This ticket covers
  the backend/model/body fields that give parity with `cell edit`.
- A board UI affordance for editing proof fields; CLI + daemon API only.

## Dependencies

None. Independent of the review/guardian surface.
"""


Your working directory is a git worktree checked out for this ticket's branch.

# RAL-289: Fix proof status resets when restarting a proof step

## Summary

Restarting a proof step in a sequence (e.g. A, B, C, D, E) currently leaves statuses in an inconsistent state. When restarting C, only the downstream steps D and E are set to pending, while A is incorrectly set to running, B incorrectly stays "done," and C itself doesn't appear to change status at all. Restarting a proof step is meant to re-run the entire sequence from the beginning (A), so every step from A onward should reset to pending and re-execute in order, with the target step's own status also reset. This does not apply to the `Set Status` action, which must continue to set a single proof's status directly with no upstream/downstream side effects.

## Values

Proof step statuses are used to reason about what has actually been verified and what hasn't. If restarting a proof leaves stale "done" statuses on steps that haven't actually re-run (like B above), users and downstream automation can wrongly trust a proof result that doesn't reflect the current code. Correcting the reset behavior keeps proof status trustworthy and matches the documented mental model: restart means "run the whole chain again from scratch."

## Risks

- The restart logic likely needs to distinguish "restart from proof step N" (reset N and everything after, run from A) from "restart squad/cell" semantics elsewhere in the codebase -- a fix scoped too narrowly could miss related restart entry points (`proof restart`, `cell restart-proof`, `task restart-proof`).
- Care is needed not to change `Set Status`'s behavior, since it's explicitly meant to be a manual override with no cascading effects.
- Status transitions during an in-flight restart (e.g. what a step earlier than the restarted one should show while the sequence re-runs) need to be defined precisely to avoid just moving the bug earlier or later in the chain.

## Acceptance Criteria

- [ ] Restarting proof step C in a sequence A→B→C→D→E resets A, B, C, D, and E all to pending, then re-runs starting from A.
- [ ] The restarted proof step itself (C) is included in the reset/re-run, not left in its prior status.
- [ ] `Set Status` on a proof step continues to set only that step's status, with no effect on upstream or downstream steps.
- [ ] Make sure auto-formatters run, linting passes, and tests pass.
"""


# RAL-351: Keep New Squad open after submit

## Summary

Update the librarian's `+ New Squad` submission flow so its primary action is labelled `Submit` in both the direct-submit and proof/manual-check paths. Add a `Submit another` checkbox beside the action, with a tooltip explaining that it keeps the UI open for an immediate additional squad submission. When enabled, a successful submission resets the form for another squad instead of closing the pop-up.

## Values

People can queue a series of squads without repeatedly reopening the composer, while retaining the submission context that commonly stays the same across related work.

## Risks

- The direct submission path and the secondary proof/manual-check path can drift, producing inconsistent labels or repeat-submission behavior.
- Resetting the form can accidentally discard an intentionally empty upstream value or a selected agent, model, or project.

## Acceptance Criteria

- [ ] The primary action is named `Submit`, replacing `Validate and Queue`, on every New Squad submission path.
- [ ] A `Submit another` checkbox appears beside the primary action and has a tooltip explaining that it leaves the UI open to submit another squad immediately.
- [ ] With `Submit another` enabled, a successful submission leaves the pop-up open and resets it for a new submission; with it disabled, the existing close-on-success behavior remains.
- [ ] Holding Shift temporarily enables `Submit another`; releasing Shift disables that temporary state, so Shift-click submits one additional squad without permanently enabling repeat mode.
- [ ] The repeat submission reset retains the previously chosen agent, model, project, and upstream value, including an intentionally empty upstream value, while resetting the rest of the new-squad form appropriately.
- [ ] The behavior works consistently whether submission proceeds directly or through the proof/manual-check pane.
- [ ] Auto-formatters run, linting passes, and relevant tests pass.

## Technical Notes

- Use the board's documented tooltip and color conventions from `librarian/AGENTS.md` and `docs/colors.md`.
- Treat the remembered upstream as a value with presence semantics: an empty value is still a remembered choice and must not be replaced by an earlier non-empty upstream.

## Out of Scope

- Changing squad validation, queueing semantics, or the task-file schema.
"""


# RAL-404: Fix slow-loading project meatball menu popup

## Summary

In the Projects tab, opening an individual registered project's meatball menu (⋯) takes roughly 8 seconds to display its popup. Profile the interaction and fix the underlying cause so the menu opens immediately.

## Values

An 8-second delay on a simple menu open reads as a hang or a broken feature, eroding trust in the UI's responsiveness. Fast, predictable UI feedback is baseline expected behavior.

## Risks

- The slowness may stem from a synchronous fetch (e.g. project settings, review config, or git status) that should be cached, deferred, or made async.
- Fixing this may overlap with RAL-408 if the meatball menu is being expanded to show more project settings -- the perf fix should hold up once that additional data is added, not regress further.
- Need to verify the fix holds under real project counts/sizes, not just a fast local sample project.

## Acceptance Criteria

- [ ] Opening a project's meatball menu shows the popup with no perceptible delay (target: near-instant, not seconds).
- [ ] Root cause of the current delay is identified and documented (not just papered over with a spinner).
- [ ] Make sure auto-formatters run, linting passes, and tests pass.

## Interview record (prior investigation, already on file for this ticket)

Q. What does the project meatball currently do?

A. Each project row's `⋯` button opens the Auto Review/Triage threshold configuration popup. The row is rendered in `librarian/assets/board/75-projects-machines.js:1353-1354` and dispatches `openProjectTriageThresholds`.

Q. Why is opening it slow?

A. `openProjectTriageThresholds` waits for `pollTriage()` before rendering the popup (`75-projects-machines.js:1392-1396`). `pollTriage` performs four requests -- types, pools, schedules, and candidates -- in parallel, then parses all four responses and renders the whole Triage tab (`75-projects-machines.js:251-274`).

Q. Is saving also slow?

A. No clear evidence indicates that saving is slow. The reported problem is opening/reopening: it takes roughly 2-3 seconds even when the cache is warm. The desired result is a quick reload/open of the menu itself, not merely a loading spinner.

## Implementation intent

Investigate the slow query/load path and make opening the project menu lightning-fast. Avoid an unnecessary full Triage-tab refresh; preserve the fast save path and keep the board responsive.
"""


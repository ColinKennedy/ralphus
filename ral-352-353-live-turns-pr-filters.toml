[[review]]
id                  = "ralphus:new-review/ral-352-353"
name                = "RAL-352 / RAL-353"
upstream            = "staging"
agent               = "pi-openrouter-deepseek"
proof_scope         = "nothing"
auto_submit_pr_stack = true
auto_fix_pr_errors  = true
skip_auto_build     = true

# ===========================================================================
# RAL-352: Surface live agent turn counts
# ===========================================================================
[[task]]
name    = "RAL-352"
project = "ralphus"
agent   = "pi-openrouter-deepseek"

  [[task.cell]]
  id                     = "work"
  name                   = "RAL-352: work"
  cwd                    = "<<ralphus:new-worktree/RAL-352-live-agent-turn-counts?upstream=staging>>"
  review                 = "<<ralphus:new-review/ral-352-353>>"
  system_prompt          = "Do NOT commit and do NOT push under any circumstances. You are working in a dedicated git worktree of the ralphus repository. Implement the ticket completely, follow all applicable AGENTS.md instructions, run the relevant formatters, linters, and tests, and keep changes in this worktree."
  system_prompt_position = "append"
  prompt                 = """
Your working directory is a git worktree checked out for this ticket's branch.

# RAL-352: Surface live agent turn counts

## Summary

Add a live agent-turn counter to the squad detail pane and a turn-count column to the Tasks tab. A cell's count combines its work turn count with the turn counts of its proofs; task and squad totals are computed on demand from their descendants rather than stored. Treat each exchanged user/agent message as a turn, and persist the per-cell and per-proof counts so they remain available after execution.

## Values

Makes agent activity and execution cost easier to understand at the cell, task, and squad levels without introducing redundant aggregate state.

## Risks

- Live updates may race with agent responses or render stale aggregate totals.
- Existing command-only execution paths must not be misrepresented as agent conversations.

## Acceptance Criteria

- [ ] The squad details pane displays a live, computed total agent-turn count.
- [ ] The Tasks tab displays a computed turn-count column for every task.
- [ ] A cell's durable count includes its work turns plus durable counts from its proofs, and task and squad totals are computed on request without persistence.
- [ ] Command-only cells and proofs report no applicable turn count, and command-mode details do not show a turn-count attribute.
- [ ] Turn counts include both sides of each agent exchange.
- [ ] Auto-formatters run, linting passes, and relevant tests pass.

## Technical Notes

Persist counts only for cells and proofs. Derive task and squad totals in the UI or its on-request data path.

## Local implementation decisions

- A turn is one exchanged user/assistant message; each agent response event represents both sides of an exchange. Exclude system messages and tool calls.
- Count every new exchange in resumed sessions and retries, including a resume prompt.
- Command-only cells and proofs have no applicable conversational count.
- Make the Tasks-tab Turns column sortable and hideable, and include task-scope proofs in squad totals.
"""

  [[task.cell]]
  id                     = "finalize"
  name                   = "RAL-352: finalize"
  cwd                    = "<<ralphus:new-worktree/RAL-352-live-agent-turn-counts?upstream=staging>>"
  depends_on             = ["work"]
  system_prompt          = "ONLY git stage the relevant source files, commit them, and push the commit if a remote exists. Do NOT run formatters, linters, or tests."
  system_prompt_position = "append"
  prompt                 = "ONLY git stage the relevant source files, commit them, and push the commit if a remote exists."

# ===========================================================================
# RAL-353: Filter tasks by pull request state
# Stacked after RAL-352 because both change the Tasks tab.
# ===========================================================================
[[task]]
name       = "RAL-353"
project    = "ralphus"
agent      = "pi-openrouter-deepseek"
depends_on = ["RAL-352"]

  [[task.cell]]
  id                     = "work"
  name                   = "RAL-353: work"
  cwd                    = "<<ralphus:new-worktree/RAL-353-filter-tasks-pr-state?upstream=staging>>"
  upstream               = "<<task:RAL-352>>"
  review                 = "<<ralphus:new-review/ral-352-353>>"
  system_prompt          = "Do NOT commit and do NOT push under any circumstances. You are working in a dedicated git worktree of the ralphus repository. Implement the ticket completely, follow all applicable AGENTS.md instructions, run the relevant formatters, linters, and tests, and keep changes in this worktree."
  system_prompt_position = "append"
  prompt                 = """
Your working directory is a git worktree checked out for this ticket's branch, stacked on top of RAL-352's finalized branch.

# RAL-353: Filter tasks by pull request state

## Summary

Add a Tasks-tab filter that limits rows to tasks with at least one associated pull request. Support filtering for any pull request, non-draft pull requests, failing pull requests, and draft pull requests. Ensure filtered rows update when asynchronously retrieved pull-request information arrives or changes.

## Values

Lets reviewers focus quickly on tasks with active review work and distinguish ready, failing, and draft pull requests.

## Risks

- Asynchronous pull-request lookups can leave the visible task list temporarily stale or incorrectly filtered.
- Pull-request status semantics must remain consistent across GitHub and GitLab.

## Acceptance Criteria

- [ ] The Tasks tab can show only tasks with at least one associated pull request.
- [ ] Users can target tasks with any pull request, a non-draft pull request, a failing pull request, or a draft pull request.
- [ ] The filtered task list updates when asynchronous pull-request data becomes available or changes.
- [ ] GitHub and GitLab expose equivalent filtering behavior.
- [ ] Auto-formatters run, linting passes, and relevant tests pass.

## Technical Notes

Integrate the filter with the Tasks tab's pull-request data flow so refreshed asynchronous results trigger a reevaluation of the visible rows.

## Local implementation decisions

- Implement composable filters: has a PR; draft status `{any, draft, non-draft}`; and CI status `{any, passing, failing}`.
- A task matches when at least one associated PR satisfies every chosen dimension. For example, Draft + Passing means it has at least one passing draft PR.
- “Failing” means the forge-reported CI/CD status `failing` only; pending and unknown do not match it.
- Existing PR data includes lifecycle and CI status; add draft state through both forge providers so GitHub and GitLab have equivalent behavior.
- Rerun predicates whenever refreshed PR data arrives.
"""

  [[task.cell]]
  id                     = "finalize"
  name                   = "RAL-353: finalize"
  cwd                    = "<<ralphus:new-worktree/RAL-353-filter-tasks-pr-state?upstream=staging>>"
  depends_on             = ["work"]
  system_prompt          = "ONLY git stage the relevant source files, commit them, and push the commit if a remote exists. Do NOT run formatters, linters, or tests."
  system_prompt_position = "append"
  prompt                 = "ONLY git stage the relevant source files, commit them, and push the commit if a remote exists."

# Tagged tests whose process counts are tracked (RAL-604; docs/proc-counts.md).
# `id` is "<nextest binary id> <test name>"; each test carries exactly one tag.
# Distinct behaviours are separate tests.

# Command proofs (daemon-side `run_command_proof*`).
[[test]]
id = "ralphus-daemon proof::tests::passing_command_is_true"
tag = "proof-command"

[[test]]
id = "ralphus-daemon proof::tests::capture_returns_output"
tag = "proof-command"

# Command cells (runner-side `run_command`).
[[test]]
id = "ralphus-runner execute::tests::run_command_reports_exit_code_and_output"
tag = "cell-command"

# Worktree initialization commands (RAL-615; daemon-side `worktree_init::run`).
[[test]]
id = "ralphus-daemon worktree_init::tests::runs_every_command_in_order_in_the_worktree"
tag = "worktree-init"

# Selectable command shell (RAL-631; `shell` on a command proof / cell).
[[test]]
id = "ralphus-daemon proof::tests::explicit_sh_runs_a_semicolon_separated_command"
tag = "command-shell"

# Diff summary of a review branch worktree against its enabled upstream (RAL-634).
[[test]]
id = "ralphus-daemon guardian_merge::branch_diff_tests::diff_summary_counts_worktree_edits_against_the_base"
tag = "branch-diff-summary"

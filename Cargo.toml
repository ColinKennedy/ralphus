[workspace]
resolver = "2"
members = ["core", "daemon", "librarian"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

# Shared dependency versions. Individual crates opt in as they need them, so a
# declaration here does not force a compile cost on crates that do not use it.
[workspace.dependencies]
ralphus-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tiny_http = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", default-features = false }

# Keep the dev profile fast to compile (this project's whole reason for the
# Python/HTML split is that the old Rust build took minutes). Release stays lean
# but we deliberately avoid codegen-units=1 to keep build times reasonable.
[profile.release]
opt-level = 2
lto = "thin"

# Strict lints, applied workspace-wide (each crate opts in with `[lints] workspace = true`).
# Warnings are hard errors so nothing rots; unsafe is forbidden by default.
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace]
resolver = "2"
members = ["core", "daemon", "librarian", "auth", "keygen", "bench-types", "bench-macros", "bench-harness"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

# Shared dependency versions. Individual crates opt in as they need them, so a
# declaration here does not force a compile cost on crates that do not use it.
[workspace.dependencies]
ralphus-core = { path = "core" }
ralphus-bench-types = { path = "bench-types" }
ralphus-bench-macros = { path = "bench-macros" }
ralphus-bench-harness = { path = "bench-harness" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tiny_http = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", default-features = false }
ed25519-dalek = "2"
base64 = "0.22"
# UTC wall-clock parsing only (RAL-122 scheduler down-time windows) — no other
# crate in the workspace needs date/time handling, so this is deliberately
# minimal: no "clock"-derived local-time features beyond `Utc::now`.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# OpenTelemetry (manual span API only — the `tracing` crate and
# `tracing-opentelemetry` are BANNED workspace-wide by RAL-79: stdout is
# reserved for the daemon<->runner JSON contract and `tracing`'s ecosystem
# defaults too easily leak onto it). `internal-logs` is excluded from both
# crates below because it transitively pulls in the `tracing` crate — and
# `opentelemetry-otlp` itself is deliberately NOT a dependency: its HTTP
# transport pulls reqwest -> tokio -> `tracing` transitively, which would
# violate RAL-79 despite never being called directly. Instead, `daemon/src/
# otel.rs` hand-rolls a minimal OTLP/JSON `SpanExporter` over the already-used
# synchronous `ureq` client (see that module for the rationale).
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }

# Keep the dev profile fast to compile (this project's whole reason for the
# Python/HTML split is that the old Rust build took minutes). Release stays lean
# but we deliberately avoid codegen-units=1 to keep build times reasonable.
[profile.release]
opt-level = 2
lto = "thin"

# Strict lints, applied workspace-wide (each crate opts in with `[lints] workspace = true`).
# Warnings are hard errors so nothing rots; unsafe is forbidden by default.
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

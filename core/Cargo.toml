[package]
name = "ralphus-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared types and logic for ralphus: task schema, validation, and DTOs."

[lints]
workspace = true

[features]
# Embeds the Bash/PowerShell tree-sitter grammars so `validate` can warn when a
# command's syntax does not match its `shell`. Off: the check is skipped.
shell-syntax = ["ralphus-shell-syntax/parser"]

[dependencies]
ralphus-shell-syntax = { path = "../shell-syntax" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
ralphus-bench-macros = { workspace = true }
ralphus-bench-types = { workspace = true }

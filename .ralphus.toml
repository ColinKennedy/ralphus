# ralphus's own project file.
#
# This is NOT a task submission. The [[review.action]] tables below are the
# manual checks the ralphus maintainers recommend for reviewing a change to this
# repository. Each has the shape of a submitted [[review.action]], plus
# [[review.action.hint]] tables saying when it applies (include_when, paths).
# The auto-review agent and the ralphus tutor read them when someone writes a
# [[review]]; they copy the checks that fit into the submission. The daemon
# never runs these and never merges them into a submission
# (docs/special-syntax.md).
#
# auto_run = true marks a check that is safe to start unattended: idempotent,
# non-destructive, non-interactive, no ports or long-lived processes. Anything
# that boots a stack or opens a browser is auto_run = false.
#
# Per AGENTS.md, a check must never start, stop or restart the maintainer's own
# dev daemon or librarian. The stack checks below take their ports as inputs
# (defaults 7891 / 7475, never the 7890 / 7474 of a regular stack) and use their
# own database, so they leave a running stack alone. Every check that boots a
# stack declares the same inputs with the same defaults, so one choice of ports
# is consistent across all of a review's checks.

[[review.action]]
label = "Tutor shows this project's hints"
command = "cargo run -q -p ralphus-cli -- tutor"
auto_run = true
description = "Prints the task tutorial followed by this file's suggested checks, nearest .ralphus.toml first."
success = "The output ends with the project's manual-check suggestions and lists every label in this file."

[[review.action.hint]]
include_when = "Any change to the tutor text, the project-file parser, or this file's [[review.action]] / [[review.action.hint]] schema."
paths = ["cli/src/tutor.rs", "core/src/project_hints.rs", ".ralphus.toml"]

[[review.action]]
label = "Board in an isolated dev stack"
command = "bash scripts/build-debug.sh --daemon-port {daemon_port} --librarian-port {librarian_port} --db-path ~/.ralphus/tasks-review-{daemon_port}.db"
cleanup_command = "ralphus-daemon stop --port {daemon_port}"
auto_run = false
description = "Boots a second daemon and board on their own database, then open the board at the librarian port. Ctrl-C stops both; the cleanup command stops a daemon left behind on that daemon port."
success = "The Reviews tab renders the changed UI in both themes, tooltips read correctly, and the browser console is clean."

[[review.action.input]]
name = "daemon_port"
message = "Port for the second daemon (not your regular stack's 7890)"
default = "7891"

[[review.action.input]]
name = "librarian_port"
message = "Port for the second board (not your regular stack's 7474)"
default = "7475"

[[review.action.prepare]]
command = "npm ci --no-audit --no-fund"

[[review.action.hint]]
include_when = "Any change to the web board: librarian/assets/, board chunks, board.css, or a color documented in docs/colors.md. Look at it in the browser; unit tests cannot judge layout, theme or tooltips."
paths = ["librarian/**", "docs/colors.md"]

[[review.action]]
label = "Daemon API in an isolated dev stack"
command = "bash scripts/build-debug.sh --daemon-port {daemon_port} --librarian-port {librarian_port} --db-path ~/.ralphus/tasks-review-{daemon_port}.db"
cleanup_command = "ralphus-daemon stop --port {daemon_port}"
auto_run = false
description = "Boots the isolated stack, then exercise the changed route against the daemon port (for example its /api/daemon), or point the CLI at it with --daemon-url."
success = "The changed endpoint answers with the documented shape, an existing database is migrated without errors in the daemon log, and the board still loads."

[[review.action.input]]
name = "daemon_port"
message = "Port for the second daemon (not your regular stack's 7890)"
default = "7891"

[[review.action.input]]
name = "librarian_port"
message = "Port for the second board (not your regular stack's 7474)"
default = "7475"

[[review.action.hint]]
include_when = "Any change to daemon routes, the store schema (new tables or columns), the scheduler, or the guardian merge pipeline."
paths = ["daemon/src/server.rs", "daemon/src/store.rs", "daemon/src/scheduler.rs", "daemon/src/guardian*.rs", "daemon/src/delivery.rs"]

[[review.action]]
label = "Auto-run of a manual check"
prompt = "Using the isolated dev stack from the checks above, on the same daemon and librarian ports they use, submit a task file with a [[review]] whose [[review.action]] sets auto_run = true and has no prepare steps. Confirm its terminal opens by itself when the review settles, runs once, and the board row shows an 'auto' badge. Then start a rebase or feedback pass while the check is still running and confirm the row shows the out-of-date warning and the run is not killed."
auto_run = false
description = "End-to-end check of auto-run, which no unit test can see: a real terminal opening unattended."
success = "One terminal, one run, an 'auto' badge, and a warning (not a kill) when a newer rebase, feedback pass or auto-PR fix arrives mid-run."

[[review.action.hint]]
include_when = "Any change to auto-run: daemon/src/auto_run.rs, the manual-check preparation hooks in guardian_merge.rs, or the auto_run setting."
paths = ["daemon/src/auto_run.rs", "daemon/src/guardian_merge.rs", "librarian/assets/board/65-reviews.js", "librarian/assets/board/67-review-inspector.js"]

[[review.action]]
label = "CLI and MCP surface"
prompt = "Build the CLI and MCP server, then run the CLI with '<group> --help' for each command group you changed and confirm the help text, flags and defaults read correctly. List the MCP tools and confirm every new CLI command or flag has a matching tool."
auto_run = false
description = "Reads the changed help text the way a user would; mcp/tests/parity.rs only proves a tool exists, not that its description is right."
success = "Help text is accurate, flags are documented with their defaults, and each new CLI command has an MCP tool."

[[review.action.hint]]
include_when = "Any change to the CLI command tree (cli/src/help_map.rs, cli/src/commands/) or the MCP server."
paths = ["cli/src/**", "mcp/src/**"]

[[review.action]]
label = "Documentation site"
command = "bash scripts/docs-build.sh"
auto_run = true
description = "Renders docs/site/pages into docs/site/_site with MkDocs (git-ignored). Read the changed pages in the output."
success = "The build finishes without warnings about broken links or missing pages."

[[review.action.hint]]
include_when = "Any change under docs/ or to a command or board surface the docs describe."
paths = ["docs/**"]

# RAL-412: Order automatic review worktrees semantically

## Summary

When the arbiter drains an automatic-review pool—whether the minimum threshold is met or a scheduled pass includes remaining candidates—it should choose the review worktree order by relatedness of the candidates' intended work rather than pool membership order. Provide the arbiter with bounded prompt context for every candidate cell, ask it for a deterministic proposed ordering that places related changes together, and apply that ordering when the automatic review is created.

## Values

Keeping closely related changes adjacent makes a review easier to follow and reduces unnecessary context switching while preserving automatic review creation for both full and straggler pools.

## Risks

- Candidate prompts can be individually or collectively too large for a single arbiter request, so prompt extraction and aggregate context must be capped without losing useful intent.
- The arbiter response may be malformed, incomplete, or contain duplicate/unknown candidates; a safe fallback order is required.
- Semantic ordering must not disturb the existing linear review branch stack or omit any pooled candidate.

## Acceptance Criteria

- [ ] An automatic review created after either a threshold drain or scheduled straggler drain asks the arbiter to order all pooled candidates using their cell prompt context.
- [ ] Each candidate contributes a bounded prompt excerpt, preferring concise leading summary text where appropriate, and the combined arbiter input is capped to a reasonable configured or documented limit.
- [ ] The resulting review worktrees and branch stack follow the arbiter's valid proposed order, with related work placed together when the arbiter identifies it.
- [ ] Invalid, incomplete, or unusable ordering output safely falls back to the existing deterministic order while retaining every candidate exactly once.
- [ ] Regression tests cover both pool-drain paths, prompt-size limits, valid semantic ordering, and fallback behavior without breaking the review's linear PR/MR stack.
- [ ] Auto-formatters run, linting passes, and relevant tests pass.

## Technical Notes

- Send one bounded aggregate request containing labeled context for every candidate; do not issue pairwise comparisons or one arbiter request per candidate.
- The arbiter should return an order over stable candidate identifiers so the result can be validated as a permutation of the drained pool before review worktrees are created.

## Out of Scope

- Changing which candidates qualify for a pool or the threshold/cron drain policy.
- Reordering an already-created review.

Use the existing Arbiter `maximum_budget_usd` cap. Adopt a documented fixed aggregate prompt-context limit, rather than adding schema/configuration. Request stable candidate cell IDs and accept the response only if it is an exact permutation of the drained pool; request failure, budget exhaustion, malformed, incomplete, duplicate, or unknown IDs must safely preserve the current deterministic ordering and every candidate exactly once.
"""


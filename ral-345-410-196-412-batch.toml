# RAL-410: CI check for endpoint-to-CLI parity

## Summary

Add a CI/CD check that verifies every daemon API endpoint has a corresponding CLI equivalent, or carries an inline comment explaining why it deliberately doesn't. This mirrors the existing `mcp/tests/parity.rs` pattern (RAL-301) that enforces CLI↔MCP-tool parity with a documented-reason exclusion list, but for endpoint↔CLI coverage.

## Values

Without this check, new daemon endpoints can silently ship without CLI support, leaving the CLI surface incomplete and forcing users to fall back to raw HTTP calls. An automated gate keeps the CLI a reliable, complete client of the daemon API as the API grows.

## Risks

- Endpoints that are intentionally internal-only (e.g. used only by the librarian's proxy) need a clear, low-friction way to be excluded rather than forcing an artificial CLI command.
- Keeping the endpoint list and CLI command list in sync as both evolve could require nontrivial static analysis or a maintained manifest.
- False positives could block unrelated PRs if the check is too strict or misses legitimate exclusions.

## Acceptance Criteria

- [ ] A CI check enumerates all daemon HTTP API endpoints (per `docs/daemon-api.md`) and all CLI leaf subcommands.
- [ ] Every endpoint either maps to a CLI command or has a documented-reason exclusion (mirroring the exclusion-list pattern in `mcp/src/exclusions.rs`).
- [ ] The check runs as part of `.github/workflows/ci.yml`.
- [ ] Make sure auto-formatters run, linting passes, and tests pass.

## Dependencies

- Related prior art: RAL-301 (MCP tool parity check, `mcp/tests/parity.rs`).

Use a fast static, bidirectional CI check. Every daemon endpoint and CLI command must be accounted for; intentionally unmatched entries need an inline, substantive, reason-required exclusion, ideally adjacent to the relevant static definition.
"""


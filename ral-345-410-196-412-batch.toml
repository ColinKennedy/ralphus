# RAL-345: Add multi-select project filter to Tasks and Squads tabs

## Summary

Add a project filter to the Tasks and Squads tabs that lets a user add or remove any number of project names, rendered the same way existing label-lists are (a bordered chip per selection with an "X" on the left to remove it). All projects are shown by default (no filter applied); a dropdown lets the user pick a registered project by name, listed alphabetically, to add to the filter set.

## Values

Users working across many registered projects need to narrow the Tasks/Squads views down to just the project(s) they currently care about, without losing everything else from view permanently or having to re-select every time they switch tabs.

## Risks

- Must reuse the existing label-list chip pattern exactly (border-box + left-side "X") rather than introducing a visually inconsistent filter control — check `librarian/assets/board/*.js` for the current label-list implementation before building a new one.
- Any color used for the chip/border must come from `docs/colors.md` — no hardcoded hex values (see `librarian/AGENTS.md`).
- "Keep current selection in-memory" implies no persistence across page reloads; confirm this is intentional and not just deferred scope, since users may expect the filter to survive a refresh.
- Alphabetical project list needs to stay in sync as projects are registered/removed — verify there's a live registered-projects source to bind the dropdown to rather than a stale snapshot.

## Acceptance Criteria

- [ ] Tasks tab and Squads tab each get the project filter; all projects shown by default.
- [ ] Dropdown lists registered projects alphabetically by name.
- [ ] Filter supports multi-selection; each selected project renders as a removable chip with an "X".
- [ ] Selection is kept in-memory for the session (not necessarily persisted across reloads).
- [ ] Make sure auto-formatters run, linting passes, and tests pass.

## Technical Notes

- Existing label-list chip styling lives in `librarian/assets/board/*.js` and `librarian/assets/board.css` — reuse rather than reinvent.

Additional clarified requirements: a squad matches when any of its tasks belongs to a selected project. Persist project selections using the existing status-filter persistence mechanism. Also upgrade the unrelated Triage tab's existing single-select project filter to the same multi-select pattern. Combine project selection with existing status/search filtering using AND.
"""


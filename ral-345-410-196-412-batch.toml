# RAL-196: Allow review PRs to be submitted as drafts

## Summary

When submitting PRs from a Guardian review (see RAL-195), give the user the option to open them as draft PRs instead of ready-for-review PRs. The default is a per-project setting owned by the project registrar (the project's `.ralphus.toml` config) — e.g. a `[github] draft_by_default` key — so a project can decide "PRs from this repo start as drafts" once, without every reviewer having to remember to set a flag. Individual reviews can override that project default at submit time (force-draft or force-ready-for-review for that one submission), so the project-level setting is a default, not a hard rule.

## Values

Reviewers often want to push a review's branches up as PRs early — to trigger CI, share a link, or get eyes on work-in-progress — without signaling that the stack is ready for final review. Draft PRs are GitHub's built-in mechanism for this. Different projects have different norms (some always want drafts first, some never use them), so the decision belongs at the project level by default — but a reviewer submitting one specific review still needs the ability to deviate from that norm without changing the project-wide setting for everyone else.

## Risks

- Needs to compose cleanly with RAL-195's stacked-PR submission — draft state must apply consistently across the whole stack, not just the first/last PR.
- `gh pr create --draft` (or the equivalent stack subcommand flag) behavior should be verified against whatever `gh stack submit` supports, since draft support for the new stack commands may differ from plain `gh pr create`.
- Config precedence must be unambiguous: per-review override at submit time always wins over the project registrar's default; the project default only applies when the reviewer doesn't explicitly choose.
- Should not be the only way to submit — non-draft remains a first-class option regardless of the project default.

## Acceptance Criteria

- [ ] Project registrar can set a project-level default (draft vs. ready-for-review) for PRs submitted from reviews in that project, via `.ralphus.toml`.
- [ ] At submit time, a reviewer can override the project default for that specific review's submission (either direction).
- [ ] When no override is given, the project default is used; when an override is given, it wins.
- [ ] Draft PRs created this way are indistinguishable from ones a human marked as draft via the GitHub GUI.
- [ ] Make sure auto-formatters run, linting passes, and tests pass.

## Dependencies

Depends on RAL-195 (GitHub stacked PR integration) for the underlying submit path.

Implement provider-specific project defaults as `[github] draft_by_default` and `[gitlab] draft_by_default`, using the established global → per-project config → explicit per-call override precedence. Add `draft: Option<bool>` to the submit request. GitHub must use the REST API `draft` field; GitLab must create a real draft MR by managing the `Draft:` title prefix. This must work for both normal REST stacked-base chaining and any optional stacked submission path, without using gh/glab for forge calls.
"""


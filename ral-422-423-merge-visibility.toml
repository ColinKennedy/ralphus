    id     = "rust"
    prompt = "Run `cargo fmt --all -- --check`, `cargo clippy --all-targets -- -D warnings`, and focused daemon tests. Do not run `cargo test --all-targets` or `cargo nextest run --all-targets`; use `cargo nextest run -p ralphus-daemon --lib` for daemon coverage. Fix only task-caused failures and re-run. Do NOT commit or push. End with `RALPHUS_PROOF: PASS` only if all selected checks pass."


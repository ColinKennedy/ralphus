Your working directory is a git worktree checked out for this ticket's branch.

# RAL-422: Instrument the merge pipeline's silent phases

## Summary

After a review's last branch finishes rebasing, `run_merge_shared` in `daemon/src/guardian_merge.rs` runs a sequence of further steps before the review reaches `in_review`. Every one of those steps is currently uninstrumented: no `rlog!`, no `cartographer_log`, no `log_event`, and no intermediate guardian status. The daemon is busy for many minutes and emits nothing at all, so the board has nothing to render and the review is indistinguishable from a hang.

This was observed live on `guardian-000000000090`. Measured from its own review log and Cartographer rows:

- `18:41:13` the last branch (`branch-000000000310`) transitions to `done` — the final logged event.
- `18:41:40` the combined worktree is fully written to disk.
- `18:41:57` a tmux session, two `ralphus-runner` processes and a node process spawn (the manual-checks agent).
- `18:41:57` through `18:51:41` — **nine minutes forty-four seconds with zero log lines, zero Cartographer rows, and zero status changes.**
- `18:51:41` `review -> in_review` appears, the first event in almost ten minutes.

The immediately preceding merge cycle on the same review showed the same phase taking eleven minutes three seconds, so this is the normal duration of the phase, not an anomaly.

## Values

Missing instrumentation here is not only a logging-policy violation; it silently disables the board's entire live-update path. `daemon/src/events.rs` is fed exclusively by `Store::cartographer_log`, and its own module documentation states the assumption it rests on: "Cartographer already instruments every notable state transition". The board consumes that stream over `GET /api/events` as its primary refresh trigger, with only a sixty-second `setInterval` fallback behind it.

So a phase that writes no Cartographer row emits no server-sent event, and a board watching that review does not refresh at all for the phase's whole duration except on the sixty-second fallback timer. The ten-minute silent phase above produced a frozen-looking review pane for exactly that reason. Restoring instrumentation restores push updates as a direct consequence.

Beyond that, a review spending ten minutes in a phase that reports nothing is the single largest source of "is this stuck or is it working?" ambiguity in the product. Users cannot tell a healthy long-running phase from a dead merge worker, and the only way to find out today is to list operating-system processes by hand.

## Risks

- Over-logging a per-branch loop could flood Cartographer on a large stack; instrumentation must be per-phase, not per-iteration, except where a phase genuinely has per-branch substeps worth separating.
- A new guardian status value is a state-machine change; adding one risks breaking status matches elsewhere in the daemon, the CLI, and the board.
- Emitting a Cartographer row requires the store lock. These call sites sit in a background merge worker, and the lock must never be held across the subprocess or network call the phase is about to make.

## Acceptance Criteria

- [ ] `generate_manual_commands` (`daemon/src/guardian_merge.rs`) emits a paired start and completion record — stderr via `rlog!` and a structured Cartographer row — around its agent invocation, including the resolved agent and model and the elapsed duration on completion, and a distinct record when it returns early because there is nothing to summarize.
- [ ] The same start/completion treatment is applied to every other currently-silent phase of the merge pipeline. A survey of the current code found these with zero instrumentation: `regenerate_readme`, `run_commit_checks`, `final_checks`, `claim_combined_review_ref_by_id`, and `compute_sync_status` in `daemon/src/pr.rs`. Verify this list against the code rather than trusting it, and instrument every silent phase found, not only the listed ones.
- [ ] `final_checks`'s project-default `auto_build` tier logs the command it is about to run and the outcome. The review-declared `auto_build` tier already logs its outcome; bring it to the same start/done shape rather than leaving the two tiers inconsistent.
- [ ] A review in the post-branch phase is distinguishable from one that is idle, from both the API and the board, without reading operating-system process lists.
- [ ] Long phases report progress or at least liveness while running, not only on completion, so a phase that genuinely hangs is distinguishable from one that is merely slow.
- [ ] Every new record follows `.agent/logging-policy.md`: stderr and Cartographer together, never stdout, with the `ralphus[ignore-rlog-pair]` marker used only where genuinely justified and with a reason.
- [ ] A board connected to `GET /api/events` receives at least one event during each instrumented phase, so a review in a long phase refreshes from the push stream rather than only from the sixty-second fallback timer. Prove this with a test asserting the event bus publishes during the phase, not by inspection.
- [ ] Audit the rest of the daemon for the same class of defect: any operation that can run for longer than the sixty-second fallback interval without writing a Cartographer row leaves the board un-pushed for its whole duration. Report what was found and fix what is in reach of this ticket.
- [ ] Regression coverage proves each instrumented phase emits its records, including the failure and early-return paths, not only the happy path.
- [ ] Auto-formatters run, linting passes, and relevant tests pass.

## Technical Notes

`run_merge_shared` is the orchestrator; read it end to end and treat every call it makes between the branch loop and `set_status(GuardianStatus::InReview, ...)` as in scope. `worktree_add_or_reset` is already instrumented and is a reasonable shape to copy.

Observe the dogfooding restriction in AGENTS.md: do not run `cargo test --all-targets` or `cargo nextest run --all-targets`. Use `cargo nextest run -p ralphus-daemon --lib` for daemon coverage.

## Local implementation decisions

- Prefer a phase-level guardian status or a phase field over a free-text notice, so the board can render the current phase name rather than parse a message.
- If a new guardian status is introduced, audit every existing match on guardian status across `daemon/`, `cli/`, and `librarian/assets/board/` and update each one; a new status that falls through an existing match arm silently is worse than no new status.
- Record elapsed duration on the completion record for every phase, so the ten-minute manual-checks phase is measurable from Cartographer alone in future.
- Do not hold the store lock across the agent invocation or any subprocess spawn; acquire it only to write each record.
"""


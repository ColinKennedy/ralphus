  system_prompt_position = "append"
  prompt                 = """
Your working directory is a git worktree checked out for this ticket's branch, stacked on top of RAL-422's finalized branch.

# RAL-423: Stop slow PR drift checks from stalling the board

## Summary

The "Merge / rebase" button stays on its "Starting…" pending label for tens of seconds to minutes after the daemon has already accepted the request, and the review pane renders stale branch and pull-request data for just as long. Neither is caused by the merge itself. Both are caused by the board's reload path serializing on `GET /api/pull-requests/{id}/sync-status`, which is slow because the RAL-366 background cache poller holds the very lock that endpoint needs.

Measured on the running daemon, with seventy open pull requests across twenty-eight reviews:

- `GET /api/pull-requests/{id}/sync-status` takes 7.7 s, 12.7 s, 17.6 s, 18.4 s and 20.6 s across repeated samples.
- The underlying network operation the endpoint performs takes 1.8 s, measured directly with `git ls-remote`. The remaining time is lock wait, not work.
- `GET /api/guardians`, a pure database read, takes 3.5 s to 10.3 s.
- A full RAL-366 poller pass takes roughly 505 s against a configured 300 s interval, so the poller is effectively always running. Per-pull-request cost is a 5.5 s median and a 16.4 s ninetieth percentile.
- The write worker answers in 176 ms to 203 ms, so nothing is queued behind mutating work.

There are three separate contributors, all of which must be addressed for the symptom to go away:

1. `refresh_pr_forge_cache_for_guardian` in `daemon/src/pr.rs` acquires every pull request's `SYNC_FETCH_LOCKS` entry with `try_lock`, then holds all of those guards across the loop that performs its forge comment API calls — two network round-trips per pull request. `fetch_remote_tip`, reached from `compute_sync_status`, takes the same lock with a blocking `lock()`. The doc comments on both the function and `docs/daemon-api.md` claim neither side waits on the other; that is only true in one direction, and the direction that matters to a user is the one that blocks.
2. Each blocked request occupies one of the twelve read-pool workers for its entire blocked duration, so unrelated reads queue behind them. `READ_WORKERS`' own doc comment predicts exactly this starvation.
3. `mergeReview` in `librarian/assets/board/65-reviews.js` holds its pending state until `await tick()` resolves, and `tick()` in `librarian/assets/board/70-sse.js` is a fully sequential await chain that ends in `pollReviews`, which itself awaits every open pull request's drift check before it finishes.

## Values

The merge button currently lies about how long the daemon took to accept a request, and the review pane shows stale state while a merge is actively progressing. Together they make healthy work look broken, which is what leads users to click the button repeatedly or conclude a review is stuck.

## Risks

- Releasing the drift locks earlier changes the poller's concurrency envelope against interactive callers; a pull request could be fetched by both sides at once if the release point is chosen carelessly.
- Clearing the button's pending state earlier could re-enable it before the daemon's state transition is visible, reintroducing the double-submission this pending state exists to prevent.
- The board's per-poll drift fetches write into shared state; making them non-blocking must not let a slow response from an earlier poll overwrite a newer one.

## Acceptance Criteria

- [ ] The RAL-366 cache poller no longer holds any pull request's drift-check lock across a forge network call. The drift pass and the comment pass are separated so the guards are released before the comment fetches begin.
- [ ] An interactive `sync-status` request is never blocked by the background poller for longer than one pull request's own git fetch, and this is proven by a regression test rather than asserted in a comment.
- [ ] The doc comments on `refresh_pr_forge_cache_for_guardian` and the matching prose in `docs/daemon-api.md` are corrected to describe the actual behavior in both directions.
- [ ] `sync-status` served under normal conditions is close to the cost of its own git fetch, not a multiple of it.
- [ ] The "Merge / rebase" pending state clears when the daemon answers the kickoff request, not after a full board reload, while still preventing double submission.
- [ ] The review pane renders pull-request badges and branch state from data that has already arrived instead of waiting on every open pull request's drift check.
- [ ] A drift result arriving from an earlier poll can never overwrite a newer poll's value.
- [ ] Auto-formatters run, linting passes, and relevant tests pass, including the board's own pure tests.

## Technical Notes

The working tree this ticket's branch is cut from may already contain an uncommitted partial change to `pollPullRequests` in `librarian/assets/board/70-sse.js` that stops it awaiting the drift checks. Do not assume it is present. Implement the board-side change in this worktree from scratch, and keep it as small and self-contained as possible so that reconciling it with any local edit is trivial.

RAL-366 added a cached forge state table and a `GET /api/pull-requests/forge-cache-index` endpoint that no consumer currently reads. Consider whether `compute_sync_status` should serve from that cache when the cached observation is recent enough, falling back to a live check otherwise. That was the stated purpose of the cache and it would remove the contention at its source rather than shortening the window.

Observe the dogfooding restriction in AGENTS.md: do not run `cargo test --all-targets` or `cargo nextest run --all-targets`. Use `cargo nextest run -p ralphus-daemon --lib` for daemon coverage.

## Local implementation decisions

- Split the poller's per-guardian loop into a drift pass that holds the guards and a comment pass that runs after they are dropped, rather than trying to release individual guards inside the existing single loop.
- Keep the existing non-blocking `try_lock` behavior for the drift pass; a pull request an interactive caller is already checking should still be skipped for that cycle.
- Clear the merge button's pending state on the daemon's response, and rely on the review's own status transition out of a startable state to keep the button disabled afterwards.
- Do not change the poll interval or the poller's on/off switch as a workaround; the contention is the defect.
"""


[[task]]
name = "arbiter-bugfix-smoke-test"
project = "ralphus"
agent = "claude-code"
model = "haiku"
auto_compact_threshold = 150000
maximum_tool_output_tokens = 8000
timeout_minutes = 15

  [[task.cell]]
  id = "bug-fix"
  name = "BUG FIX: add an Arbiter smoke-test marker"
  cwd = "<<ralphus:new-worktree/arbiter-bugfix-smoke-test?upstream=alt/staging>>"
  triage = true
  prompt = """
This is explicitly a BUG FIX task. Treat it as a bug fix, describe it as a bug fix,
and ensure any automatic Triage or Arbiter classification can clearly recognize that
this work belongs in the bug-fix category.

The implementation itself must stay intentionally trivial:

1. Add exactly one new file at the repository root named
   `arbiter-bugfix-smoke-test.txt`.
2. Give the file exactly this one line of content:
   `Hello, world! This file verifies the Arbiter bug-fix submission path.`
3. Do not modify, format, or generate any other file.
4. Stage only `arbiter-bugfix-smoke-test.txt` and commit it with the commit message
   `fix: add arbiter bug-fix smoke-test marker`.
5. Do not push the branch.

The sole purpose of this bug fix is to create a harmless committed file so Ralphus can
exercise automatic Triage and verify that the Arbiter creates its review from the
registered `ralphus` project's filesystem path.
"""

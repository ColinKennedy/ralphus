<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ralphus</title>
    <style>
      :root {
        --bg: #0d1117; --panel: #161b22; --panel-2: #1c2129; --border: #30363d;
        --text: #e6edf3; --muted: #8b949e; --accent: #4aa3ff; --danger: #f85149;
        --running: #4aa3ff; --done: #3fb950; --failed: #f85149; --pending: #8b949e;
        --queued: #a371f7; --cancelled: #6e7681; --teal: #39c5cf;
      }
      [data-theme="light"] {
        --bg: #ffffff; --panel: #f6f8fa; --panel-2: #eef1f4; --border: #d0d7de;
        --text: #1f2328; --muted: #656d76; --accent: #0969da;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
      code, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
      button { font: inherit; cursor: pointer; }

      header { display: flex; align-items: center; justify-content: space-between;
        padding: 9px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
      .brand { display: flex; align-items: center; gap: 14px; font-weight: 600; }
      .logo { color: var(--accent); letter-spacing: .5px; }
      .tabs { display: flex; gap: 4px; }
      .tab { background: none; border: none; color: var(--muted); font-weight: 500; padding: 6px 12px; border-radius: 6px; }
      .tab:hover, .tab.active { color: var(--text); background: var(--panel-2); }
      .status-right { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 13px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
      .dot.on { background: var(--done); box-shadow: 0 0 6px var(--done); }
      .dot.off { background: var(--failed); }
      .running-btn { position: relative; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 4px 10px; border-radius: 6px; }
      .running-menu { position: absolute; right: 0; top: 110%; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; min-width: 220px; padding: 6px; z-index: 30; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
      .running-menu div { padding: 6px 8px; border-radius: 6px; cursor: pointer; }
      .running-menu div:hover { background: var(--panel-2); }
      .icon-btn { background: none; border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 3px 8px; }
      .copy-btn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 5px; padding: 0 6px; font-size: 12px; line-height: 1.7; vertical-align: middle; }
      .copy-btn:hover { color: var(--text); }
      .copy-btn.copied { color: var(--done); border-color: var(--done); }
      .copy-menu { position:fixed;z-index:999;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:4px 0;box-shadow:0 4px 16px #0005;min-width:110px; }
      .copy-menu-item { padding:5px 14px;cursor:pointer;font-size:12px;color:var(--text);white-space:nowrap; }
      .copy-menu-item:hover { background:var(--panel-2); }
      .logs-btn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 5px; padding: 1px 7px; font-size: 11px; line-height: 1.6; vertical-align: middle; margin-left: 6px; }
      .logs-btn:hover { color: var(--text); }
      .logs-btn.fail { color: var(--failed); border-color: var(--failed); }

      /* RAL-12: sidebar/details widths are draggable (var-driven) and persisted. */
      main#tasks-page { display: grid; grid-template-columns: var(--sidebar-w, 280px) 6px 1fr 6px var(--details-w, 340px); height: calc(100vh - 51px); }
      main#reviews-page { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 51px); }
      main#resources-page { height: calc(100vh - 51px); overflow-y: auto; padding: 18px 20px; }
      .res-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .res-table th { text-align: right; padding: 6px 12px; color: var(--muted); font-weight: 500; cursor: pointer; white-space: nowrap; user-select: none; }
      .res-table th:first-child, .res-table td:first-child { text-align: left; }
      .res-table th.sorted { color: var(--text); }
      .res-table td { padding: 6px 12px; border-bottom: 1px solid var(--border); text-align: right; }
      .res-table tbody tr:hover { background: var(--panel-2); }
      .res-jump { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; color: var(--accent); padding: 2px 8px; font-size: 12px; cursor: pointer; }
      .res-jump:hover { border-color: var(--accent); }
      .col { overflow-y: auto; }
      .splitter { cursor: col-resize; background: transparent; transition: background .12s; }
      .splitter:hover, .splitter.dragging { background: var(--accent); }
      .sidebar { border-right: 1px solid var(--border); background: var(--panel); }
      .detail-pane { border-left: 1px solid var(--border); background: var(--panel); }
      .center { padding: 18px 20px; }

      .side-head { padding: 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
      .side-head input[type=text] { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 8px; }
      .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .chip { background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 3px 8px; font-size: 12px; }
      .chip.active { color: var(--text); border-color: var(--accent); }
      .newtask { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 6px 10px; font-weight: 600; }
      .status-filters label { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); margin-right: 6px; }

      .run-item { padding: 9px 12px; border-left: 3px solid transparent; border-bottom: 1px solid var(--border); cursor: pointer; }
      .run-item:hover { background: var(--panel-2); }
      .run-item.selected { background: var(--panel-2); border-left-color: var(--accent); }
      .run-item .rid { font-family: ui-monospace, monospace; font-size: 13px; }
      .run-item .meta { color: var(--muted); font-size: 12px; margin-top: 2px; display: flex; align-items: center; gap: 6px; }
      .run-item .runbtn { float: right; font-size: 11px; padding: 1px 6px; }

      .selectable { cursor: pointer; border: 1px solid transparent; }
      .selectable.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
      .run-banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border); margin-bottom: 16px; position: relative; z-index: 1; }
      .run-banner .rid { font-family: ui-monospace, monospace; font-size: 17px; }
      .task { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); margin-bottom: 16px; overflow: hidden; position: relative; z-index: 1; }
      .task-head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--border); background: var(--panel-2); font-weight: 600; }
      .task-body { padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 12px; }
      .session { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; min-width: 210px; background: var(--bg); }
      .session .sid { font-family: ui-monospace, monospace; font-weight: 600; }
      .session .kv { color: var(--muted); font-size: 12px; margin-top: 3px; }
      .vchips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
      .vchip { border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; font-size: 11px; display: flex; gap: 4px; align-items: center; }
      .verify-chain { display: flex; gap: 6px; padding: 0 14px 12px; flex-wrap: wrap; align-items: center; }
      .verify-chain .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-right: 4px; }
      /* per-session verify list, under a dashed separator inside the session card */
      .sverify { margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 7px; display: flex; flex-direction: column; gap: 4px; }
      .sverify .label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
      .sv-row { display: flex; align-items: center; gap: 6px; font-size: 12px; }
      .sv-row .sv-name { font-family: ui-monospace, monospace; }

      .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); }
      .p-running { color: var(--running); border-color: var(--running); animation: pulse 1.6s infinite; }
      .p-done { color: var(--done); border-color: var(--done); }
      .p-failed { color: var(--failed); border-color: var(--failed); }
      .p-pending { color: var(--pending); } .p-queued { color: var(--queued); border-color: var(--queued); }
      .p-cancelled { color: var(--cancelled); }
      .p-conflict_resolved { color: var(--queued); border-color: var(--queued); }
      .p-in_progress { color: var(--running); border-color: var(--running); }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

      .detail-pane { padding: 16px 18px; }
      .empty { color: var(--muted); text-align: center; margin-top: 40px; }
      .dhead { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
      .dhead .k { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
      h3.section { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 18px 0 8px; }
      .kv-row { display: flex; gap: 8px; margin: 4px 0; font-size: 13px; }
      .kv-row .k { color: var(--muted); min-width: 96px; }
      .kv-row .v { word-break: break-word; }
      .prompt-box { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; max-height: 200px; overflow: auto; white-space: pre-wrap; font-size: 12px; }
      .cmd-list { max-height: 96px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
      .cmd-line { padding: 5px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; font-family: ui-monospace, monospace; border-bottom: 1px solid var(--border); cursor: pointer; }
      .cmd-line:last-child { border-bottom: none; }
      .cmd-line:hover { background: var(--panel-2); }
      .warn { background: rgba(248,81,73,.12); border: 1px solid var(--failed); color: var(--failed); border-radius: 6px; padding: 8px; font-size: 12px; margin: 8px 0; }
      .edit-form label { display: block; font-size: 12px; color: var(--muted); margin-top: 8px; }
      .edit-form input, .edit-form textarea, .edit-form select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 8px; margin-top: 3px; }
      .btn { border: 1px solid var(--border); background: var(--panel-2); color: var(--text); border-radius: 6px; padding: 5px 12px; }
      .btn.primary { background: var(--accent); color: #fff; border: none; }
      .btn.danger { color: var(--danger); border-color: var(--danger); }
      .btn[disabled] { opacity: 0.38; cursor: not-allowed; pointer-events: none; }
      .btn-row { display: flex; gap: 8px; margin-top: 14px; }

      .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 50; }
      .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: 560px; max-width: 92vw; padding: 18px; }
      .modal h2 { margin: 0 0 12px; font-size: 16px; }
      .modal textarea { width: 100%; height: 240px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px; font-family: ui-monospace, monospace; }
      .modal .btn-row { justify-content: flex-end; }
      .verr { color: var(--failed); font-size: 12px; margin: 4px 0; }
      .hidden { display: none; }

      .progress { height: 8px; background: var(--panel-2); border-radius: 999px; overflow: hidden; display: flex; margin: 6px 0 12px; }
      .progress > span { display: block; height: 100%; }
      .branch-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; margin: 4px 0; background: var(--bg); }
      .branch-conflict-bar { margin: 2px 8px 4px; }
      .branch-conflict-label { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
      .branch-conflict-label .conflict-icon { font-size: 12px; }
      .branch-row[draggable=true] { cursor: grab; }
      .branch-row.dragover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
      .branch-row .grip { color: var(--muted); }
      .br-toggle { color: var(--muted); cursor: pointer; width: 14px; display: inline-block; text-align: center; user-select: none; }
      .br-toggle:hover { color: var(--text); }
      .br-toggle.placeholder { visibility: hidden; }
      .branch-detail { margin: 2px 0 6px 22px; }
      .badge { font-size: 11px; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--border); }
      .badge.warn2 { color: var(--queued); border-color: var(--queued); }
      .badge.bad { color: var(--failed); border-color: var(--failed); }
      .chat-bubble-wrap { display: flex; margin: 5px 0; }
      .chat-bubble-wrap.user { justify-content: flex-end; }
      .chat-bubble-wrap.guardian { justify-content: flex-start; }
      .chat-bubble-wrap > div { max-width: 80%; }
      .chat-bubble { max-width: 100%; padding: 7px 10px; border-radius: 14px; font-size: 13px; white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
      .chat-bubble-wrap.user .chat-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
      .chat-bubble-wrap.guardian .chat-bubble { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 4px; }
      .chat-label { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 2px; }
      .chat-bubble-wrap.user .chat-label { text-align: right; }
      .ctx-menu { position: fixed; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 5px; z-index: 60; min-width: 160px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
      .ctx-menu div { padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
      .ctx-menu div:hover { background: var(--panel-2); }
      .ctx-menu div.danger { color: var(--danger); }
      .sel-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
      .sel-tab { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
      .sel-tab.active { border-color: var(--accent); color: var(--text); }
      .sel-tab .x { color: var(--muted); }
      #ready-banner:empty { display: none; }
      .ready-banner { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: rgba(63,185,80,.12); border-bottom: 1px solid var(--done); color: var(--text); font-size: 13px; }
      .ready-banner a { color: var(--accent); text-decoration: none; font-weight: 600; }
      .ready-banner a:hover { text-decoration: underline; }

      /* ---- Tooltip system (RAL-40) ---- */
      /* Use data-tip="..." on any element. The JS engine below renders a styled
         popover near the cursor — dark-themed, multi-line (use \n), max 300 px wide. */
      #board-tip {
        position: fixed; z-index: 200; pointer-events: none;
        background: var(--panel); color: var(--text); border: 1px solid var(--border);
        border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: normal;
        max-width: 300px; line-height: 1.45; white-space: pre-line;
        box-shadow: 0 4px 16px rgba(0,0,0,.5); opacity: 0; transition: opacity .1s;
      }
      #board-tip.show { opacity: 1; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="logo" data-tip="ralphus — orchestrates autonomous AI agent tasks.\nSubmit a TOML task file; the scheduler runs sessions with any model (Claude, Ollama, etc.).">ralphus</span><span id="conn" class="dot off" data-tip="Daemon connection — green means the daemon is reachable and the board refreshes every 2 s.\nRed means the daemon is down or unreachable."></span>
        <nav class="tabs">
          <button id="tab-tasks" class="tab active" onclick="showTab('tasks', true)" data-tip="Tasks — view submitted runs, their sessions, the dependency graph, and verify steps.">Tasks</button>
          <button id="tab-reviews" class="tab" onclick="showTab('reviews', true)" data-tip="Reviews — manage Guardian merge reviews: branch stacking, automated rebase, conflict resolution, and CI check gates.">Reviews</button>
          <button id="tab-resources" class="tab" onclick="showTab('resources', true)" data-tip="Resources — live CPU, RAM, and GPU usage per running session. Useful for spotting runaway processes.">Resources</button>
        </nav>
      </div>
      <div class="status-right">
        <div style="position:relative">
          <button class="running-btn" onclick="toggleRunning(event)" data-tip="Active work vs. max concurrency.\nCounts running sessions, verify steps, and guardian review merges — all of which use a concurrency slot.\nClick to see each active item and jump to it in the board."><span id="running">Running 0 / 0</span> ▾</button>
          <div id="running-menu" class="running-menu hidden"></div>
        </div>
        <span id="updated" data-tip="Last time the board polled the daemon.\nThe board refreshes automatically every 2 s.">—</span>
        <button class="icon-btn" onclick="toggleTheme()" id="theme-btn" data-tip="Toggle between dark and light theme.">☾</button>
      </div>
    </header>

    <div id="ready-banner"></div>

    <main id="tasks-page">
      <div class="col sidebar">
        <div class="side-head">
          <button class="newtask" onclick="openNewTask()" data-tip="Submit a new task — paste a TOML task definition, set an optional label, then Validate &amp; Queue sends it to the scheduler.">＋ New Task</button>
          <input type="text" id="filter" placeholder="filter by run id / label…" oninput="onFilter(this.value)" data-tip="Filter runs by run ID or label. Only matching runs appear in the list." />
          <div class="row">
            <span class="chip" data-sort="date" onclick="setSort('date')" data-tip="Sort runs by creation date.">date</span>
            <span class="chip" data-sort="name" onclick="setSort('name')" data-tip="Sort runs alphabetically by label.">name</span>
            <span class="chip" onclick="toggleDir()" id="dir-chip" data-tip="Toggle sort order between descending (↓) and ascending (↑).">↓</span>
          </div>
          <div class="status-filters row" id="status-filters"></div>
        </div>
        <div id="runs"></div>
      </div>
      <div class="splitter" data-var="--sidebar-w" data-tip="Drag to resize the sidebar. Your preference is saved between sessions."></div>
      <div class="col center" id="graph">
        <div class="empty">Select a run.</div>
      </div>
      <div class="splitter" data-var="--details-w" data-invert="1" data-tip="Drag to resize the details pane. Your preference is saved between sessions."></div>
      <div class="col detail-pane" id="details">
        <div class="empty">Select a run, task, session, or verify step.</div>
      </div>
    </main>

    <main id="reviews-page" style="display:none">
      <div class="col sidebar"><div class="side-head row" style="justify-content:space-between"><b>Reviews</b><button class="newtask" onclick="openCreateReview()" data-tip="Create a new Guardian review — set up a branch stack to rebase, validate with check gates, and approve for deployment.">＋ Create</button></div><div id="reviews"></div></div>
      <div class="col center"><div id="review-detail"><div class="empty">Select a review.</div></div></div>
    </main>

    <main id="resources-page" style="display:none">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <b>Resource Usage</b>
        <span style="color:var(--muted)" id="res-summary">—</span>
      </div>
      <div id="resources"><div class="empty">No running tasks.</div></div>
    </main>

    <div id="modal-root"></div>

    <script>
      // ---- Tooltip engine (RAL-40) ----
      // Attach data-tip="..." to any element for a styled dark-theme tooltip.
      // Multi-line content: use \n in the attribute value.
      (function () {
        const tip = document.createElement("div");
        tip.id = "board-tip"; document.body.appendChild(tip);
        let mx = 0, my = 0, cur = null;
        function reposition() {
          if (!cur) return;
          const w = tip.offsetWidth, h = tip.offsetHeight, pad = 14;
          let tx = mx + pad, ty = my - h - pad;
          if (tx + w > window.innerWidth - 8) tx = mx - w - pad;
          if (ty < 8) ty = my + pad;
          tip.style.left = tx + "px"; tip.style.top = ty + "px";
        }
        document.addEventListener("mousemove", (e) => { mx = e.clientX; my = e.clientY; reposition(); });
        document.addEventListener("mouseover", (e) => {
          const el = e.target.closest("[data-tip]");
          if (!el) { if (cur) { cur = null; tip.classList.remove("show"); } return; }
          if (el === cur) return;
          cur = el; tip.textContent = el.dataset.tip;
          tip.classList.add("show"); reposition();
        });
        document.addEventListener("mouseout", (e) => {
          const el = e.target.closest("[data-tip]");
          if (!el) return;
          if (e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("[data-tip]") === el) return;
          cur = null; tip.classList.remove("show");
        });
      })();

      const STATES = ["running","done","failed","pending","queued","cancelled"];
      let tab = "tasks";
      let runs = [], guardians = [];
      let resources = [];
      let resSort = { key: "cpu", dir: -1 };   // resource-table sort: column key + direction
      let selectedRunId = null;
      let sel = { kind: null, taskIdx: 0, sessionIdx: 0, verifyIdx: -1 };  // what's shown in the details pane
      let editing = false;
      let filters = { q: "", sort: "date", dir: -1, status: new Set(STATES) };
      let selectedGuardian = null;
      let _inPopstate = false;
      let selectedProjectTabs = {};       // gid -> project root shown in the tab view
      let expandedBranches = new Set();   // "<gid>:<pos>" for branches whose detail block is open
      let manualMenuOpen = {};            // gid -> bool, whether the manual-checks dropdown is open
      let dismissedReady = new Set(JSON.parse(localStorage.getItem("ralphus-dismissed-ready") || "[]"));
      let multiSel = new Set();   // multi-selected run ids (multi mode when size > 1)
      let anchorId = null;        // anchor for shift-range selection
      let runPaths = {};          // runId -> { "ti:si": {worktree, project} }, lazily loaded (CCTL-148)

      // ---------- helpers ----------
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
      const cvar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n) || "var(--muted)";
      const sdot = (s) => `<span class="dot" style="background:${cvar("--"+s)}"></span>`;
      const pill = (s) => `<span class="pill p-${s}">${s}</span>`;
      const findRun = (id) => runs.find((r) => r.id === id);
      const post = (path, body) => fetch(path, { method: "POST", body: body ? JSON.stringify(body) : undefined });
      const del = (path) => fetch(path, { method: "DELETE" });
      // copy-to-clipboard: a small button carrying its payload in data-copy.
      const copyBtn = (text) => `<button class="copy-btn" data-tip="Copy to clipboard." data-copy="${esc(text)}" onclick="copyText(event)">⧉</button>`;
      // Run-level Logs button (opens the logs modal) — sits next to a run's state.
      const runLogsBtn = (id) => `<button class="logs-btn" data-tip="View run logs — events, task states, session timings, and verifier output." onclick="openRunLogs(event,'${id}')">📄 Logs</button>`;
      // Per-session failure-log button (opens the traceback popup) — next to a failed badge.
      const failLogBtn = (err) => `<button class="logs-btn fail" data-tip="View the failure log — the full error traceback for this session." data-full="${esc(err)}" onclick="event.stopPropagation();openErrPopup(event)">📄 Failure log</button>`;
      async function copyText(e) {
        e.stopPropagation();
        const btn = e.currentTarget, text = btn.dataset.copy || "";
        try {
          if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
          else { const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
          btn.textContent = "✓"; btn.classList.add("copied");
          setTimeout(() => { btn.textContent = "⧉"; btn.classList.remove("copied"); }, 1200);
        } catch (_) { btn.textContent = "✗"; setTimeout(() => { btn.textContent = "⧉"; }, 1200); }
      }

      // ---------- theme ----------
      function applyTheme(t) {
        document.documentElement.dataset.theme = t;
        document.getElementById("theme-btn").textContent = t === "light" ? "☀" : "☾";
      }
      function toggleTheme() {
        const t = document.documentElement.dataset.theme === "light" ? "dark" : "light";
        localStorage.setItem("ralphus-theme", t); applyTheme(t);
      }
      applyTheme(localStorage.getItem("ralphus-theme") || "dark");

      // ---------- resizable panes (RAL-12) ----------
      // The tasks-page sidebar and details columns are var-driven grid tracks; a
      // thin splitter beside each drags its width. Widths persist in localStorage.
      const SPLIT_CFG = {
        "--sidebar-w": { key: "ralphus-sidebar-w", def: 280, min: 180, max: 520 },
        "--details-w": { key: "ralphus-details-w", def: 340, min: 240, max: 680 },
      };
      let splitDrag = null;
      function applyPaneWidths() {
        for (const [v, c] of Object.entries(SPLIT_CFG)) {
          const saved = parseFloat(localStorage.getItem(c.key));
          if (!Number.isNaN(saved)) {
            document.documentElement.style.setProperty(v, Math.max(c.min, Math.min(c.max, saved)) + "px");
          }
        }
      }
      function onSplitMove(e) {
        if (!splitDrag) return;
        const { varName, invert, startX, startW, min, max } = splitDrag;
        const delta = (e.clientX - startX) * (invert ? -1 : 1);
        const w = Math.max(min, Math.min(max, startW + delta));
        document.documentElement.style.setProperty(varName, w + "px");
      }
      function onSplitUp() {
        if (!splitDrag) return;
        const c = SPLIT_CFG[splitDrag.varName];
        const w = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(splitDrag.varName)) || c.def;
        localStorage.setItem(c.key, Math.round(w));
        splitDrag.el.classList.remove("dragging");
        document.body.style.userSelect = "";
        document.body.style.cursor = "";
        window.removeEventListener("mousemove", onSplitMove);
        window.removeEventListener("mouseup", onSplitUp);
        splitDrag = null;
      }
      function initSplitters() {
        applyPaneWidths();
        document.querySelectorAll("#tasks-page .splitter").forEach(sp => {
          sp.addEventListener("mousedown", e => {
            e.preventDefault();
            const varName = sp.dataset.var;
            const c = SPLIT_CFG[varName];
            const startW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(varName)) || c.def;
            splitDrag = { el: sp, varName, invert: sp.dataset.invert === "1", startX: e.clientX, startW, min: c.min, max: c.max };
            sp.classList.add("dragging");
            document.body.style.userSelect = "none";
            document.body.style.cursor = "col-resize";
            window.addEventListener("mousemove", onSplitMove);
            window.addEventListener("mouseup", onSplitUp);
          });
        });
      }
      initSplitters();

      // ---------- tabs ----------
      const TABS = ["tasks", "reviews", "resources"];
      function showTab(name, push = false) {
        tab = name;
        for (const t of TABS) {
          const page = document.getElementById(t + "-page");
          page.style.display = name === t ? (t === "resources" ? "block" : "grid") : "none";
          document.getElementById("tab-" + t).classList.toggle("active", name === t);
        }
        syncHash(push);
        tick();
      }

      // ---------- hash routing (#/tasks/<run>?sel=kind:ti:si&q=&sort=&dir=&status=, #/reviews/<id>) ----------
      let pendingHash = null;
      function syncHash(push = false) {
        let url;
        if (tab === "resources") {
          url = "#/resources";
        } else if (tab !== "tasks") {
          url = selectedGuardian ? `#/reviews/${selectedGuardian}` : "#/reviews";
        } else {
          const p = new URLSearchParams();
          if (sel.kind) { const vi = sel.kind === "verify" ? `:${sel.verifyIdx ?? -1}` : ""; p.set("sel", `${sel.kind}:${sel.taskIdx}:${sel.sessionIdx}${vi}`); }
          if (filters.q) p.set("q", filters.q);
          if (filters.sort !== "date") p.set("sort", filters.sort);
          if (filters.dir !== -1) p.set("dir", "asc");
          if (filters.status.size !== STATES.length) p.set("status", [...filters.status].join(","));
          const base = selectedRunId ? `#/tasks/${selectedRunId}` : "#/tasks";
          const qs = p.toString();
          url = qs ? `${base}?${qs}` : base;
        }
        if (!_inPopstate && push) history.pushState(null, "", url);
        else history.replaceState(null, "", url);
      }
      function parseHash() {
        const raw = location.hash.replace(/^#\/?/, "");
        if (!raw) return null;
        if (raw.startsWith("reviews")) {
          const guardianId = raw.split("?")[0].split("/")[1] || null;
          return { tab: "reviews", guardianId };
        }
        if (raw.startsWith("resources")) return { tab: "resources" };
        const [path, query] = raw.split("?");
        const seg = path.split("/");
        const p = new URLSearchParams(query || "");
        if (p.get("q")) filters.q = p.get("q").toLowerCase();
        if (p.get("sort")) filters.sort = p.get("sort");
        if (p.get("dir") === "asc") filters.dir = 1;
        if (p.get("status")) filters.status = new Set(p.get("status").split(",").filter(Boolean));
        return { tab: "tasks", runId: seg[1] || null, sel: p.get("sel") };  // sel is decoded in pollTasks
      }

      // ---------- filters ----------
      function renderStatusFilters() {
        const el = document.getElementById("status-filters");
        el.innerHTML = STATES.map((s) => `<label data-tip="Show or hide ${s} runs.">${sdot(s)}<input type="checkbox" ${filters.status.has(s) ? "checked" : ""} onchange="toggleStatus('${s}',this.checked)">${s}</label>`).join("")
          + `<span class="chip" onclick="allStatus(true)" data-tip="Show runs of every status.">all</span><span class="chip" onclick="allStatus(false)" data-tip="Hide all runs — clear the status filter entirely.">none</span>`;
      }
      function toggleStatus(s, on) { on ? filters.status.add(s) : filters.status.delete(s); renderRuns(); syncHash(); }
      function allStatus(on) { filters.status = on ? new Set(STATES) : new Set(); renderStatusFilters(); renderRuns(); syncHash(); }
      function onFilter(v) { filters.q = v.toLowerCase(); renderRuns(); syncHash(); }
      function setSort(k) { filters.sort = k; renderSortChips(); renderRuns(); syncHash(); }
      function toggleDir() { filters.dir *= -1; renderSortChips(); renderRuns(); syncHash(); }
      function renderSortChips() {
        document.querySelectorAll("[data-sort]").forEach((c) => c.classList.toggle("active", c.dataset.sort === filters.sort));
        document.getElementById("dir-chip").textContent = filters.dir < 0 ? "↓" : "↑";
      }
      function visibleRuns() {
        let list = runs.filter((r) => filters.status.has(r.state)
          && (r.id.toLowerCase().includes(filters.q) || (r.label || "").toLowerCase().includes(filters.q)));
        list.sort((a, b) => filters.sort === "name"
          ? filters.dir * (a.label || a.id).localeCompare(b.label || b.id)
          : filters.dir * (a.created_at_ms - b.created_at_ms));
        return list;
      }

      // ---------- sidebar ----------
      function renderRuns() {
        const el = document.getElementById("runs");
        const list = visibleRuns();
        if (!list.length) { el.innerHTML = `<div class="empty">No runs.</div>`; return; }
        el.innerHTML = list.map((r) => `
          <div class="run-item ${(r.id === selectedRunId || multiSel.has(r.id)) ? "selected" : ""}" onclick="onRunClick(event,'${r.id}')" oncontextmenu="openRunMenu(event,'${r.id}')">
            <button class="btn runbtn" onclick="openRunMenu(event,'${r.id}')" data-tip="Run actions — rename, retry, restart, cancel, or delete this run.">⋯</button>
            ${r.state === "queued" ? `<button class="btn runbtn" onclick="activateRun(event,'${r.id}')" data-tip="Activate this queued run — it was staged with hold=true and is waiting to be scheduled.">▶ Run</button>` : ""}
            <div class="rid">${esc(r.label || r.id)}</div>
            <div class="meta">${sdot(r.state)}<span>${r.state}</span>${["pending","queued"].includes(r.state) ? "" : runLogsBtn(r.id)}</div>
          </div>`).join("");
      }
      function selectRun(id) { selectedRunId = id; sel = { kind: "run", taskIdx: 0, sessionIdx: 0 }; editing = false; renderAll(); syncHash(); }
      async function activateRun(e, id) { e.stopPropagation(); await post(`/api/runs/${id}/activate`); tick(); }

      // ---------- multi-select + context menu ----------
      function onRunClick(e, id) {
        if (e.shiftKey && anchorId) {
          const vis = visibleRuns().map((r) => r.id);
          const a = vis.indexOf(anchorId), b = vis.indexOf(id);
          if (a >= 0 && b >= 0) { const lo = Math.min(a, b), hi = Math.max(a, b); multiSel = new Set(vis.slice(lo, hi + 1)); }
        } else if (e.ctrlKey || e.metaKey) {
          if (multiSel.has(id)) multiSel.delete(id); else multiSel.add(id);
          anchorId = id;
        } else {
          multiSel = new Set([id]); anchorId = id;
        }
        selectedRunId = id; sel = { kind: "run", taskIdx: 0, sessionIdx: 0 }; editing = false;
        renderAll(); syncHash(true);
      }
      function openRunMenu(e, id) {
        e.preventDefault(); e.stopPropagation(); closeRunMenu();
        const r = findRun(id); if (!r) return;
        const items = [`<div onclick="renameRun('${id}')" data-tip="Rename this run — changes the display label only.">✎ Rename</div>`];
        if (r.state === "queued") items.push(`<div onclick="runMenuAct('${id}','activate')" data-tip="Start this queued run immediately — it was held with hold=true and is waiting to be scheduled.">▶ Run</div>`);
        if (["done", "failed", "cancelled"].includes(r.state)) items.push(`<div onclick="retryRun('${id}')" data-tip="Re-run with the same parameters.\nA succeeded run will prompt for extra confirmation since it may duplicate side effects.">↻ Retry</div>`);
        if (["done", "failed", "cancelled"].includes(r.state)) items.push(`<div onclick="restartRun('${id}')" data-tip="Re-run this run and mark all downstream runs as dirty so they re-run too.\nThis cannot be undone.">⟳ Restart + downstream</div>`);
        if (!["done", "failed", "cancelled"].includes(r.state)) items.push(`<div onclick="runMenuAct('${id}','cancel')" data-tip="Cancel this run — stops all running sessions and marks the run as cancelled.">■ Cancel</div>`);
        items.push(`<div class="danger" onclick="deleteRun('${id}')" data-tip="Delete this run and all its data permanently.\nThis cannot be undone.">🗑 Delete</div>`);
        const menu = document.createElement("div");
        menu.className = "ctx-menu"; menu.id = "run-menu"; menu.innerHTML = items.join("");
        document.body.appendChild(menu);
        menu.style.left = Math.min(e.clientX, window.innerWidth - 180) + "px";
        menu.style.top = Math.min(e.clientY, window.innerHeight - 170) + "px";
      }
      function closeRunMenu() { const m = document.getElementById("run-menu"); if (m) m.remove(); }
      document.addEventListener("click", closeRunMenu);
      async function runMenuAct(id, act) { closeRunMenu(); await post(`/api/runs/${id}/${act}`); tick(); }
      function renameRun(id) {
        closeRunMenu();
        const r = findRun(id); if (!r) return;
        const name = prompt("Rename run label:", r.label || "");
        if (name === null) return;
        post(`/api/runs/${id}/edit`, { kind: "run", label: name }).then(() => tick());
      }
      // CCTL-101: retry re-runs with the same params. A succeeded run gets a
      // higher-friction confirmation (type-to-confirm) to guard against
      // accidental re-runs of successful work; a failed/cancelled one just confirms.
      async function retryRun(id) {
        closeRunMenu();
        const r = findRun(id); if (!r) return;
        if (r.state === "done") {
          const ans = prompt(`This run SUCCEEDED. Re-running it may duplicate side effects.\nType "retry" to confirm re-running "${r.label || id}".`);
          if ((ans || "").trim().toLowerCase() !== "retry") return;
        } else if (!confirm(`Retry "${r.label || id}"? It will re-run with the same parameters.`)) {
          return;
        }
        await post(`/api/runs/${id}/retry`);
        tick();
      }
      // RAL-19: restart re-runs the run and dirties every run that depends on
      // it, so the whole downstream chain re-runs once this one finishes again.
      async function restartRun(id) {
        closeRunMenu();
        const r = findRun(id); if (!r) return;
        if (!confirm(`Restart "${r.label || id}" and re-run everything downstream of it?`)) return;
        await post(`/api/runs/${id}/restart`);
        tick();
      }
      // Restart a single session and everything downstream of it within the run
      // (upstream sessions stay done and are skipped on re-run). Dependent runs
      // are dirtied too.
      async function restartSession(id, ti, si) {
        const r = findRun(id); if (!r) return;
        if (!confirm("Restart this session and everything downstream of it?")) return;
        await post(`/api/runs/${id}/sessions/${ti}/${si}/restart`);
        tick();
      }
      // Open a resumed claude-code session in a new terminal window. mode is
      // "readonly" (no writes allowed) or "open" (full access).
      async function openTerminal(runId, ti, si, mode) {
        try {
          const resp = await fetch(`/api/runs/${runId}/sessions/${ti}/${si}/open-terminal?mode=${mode}`, {method:'POST'});
          if (!resp.ok) {
            const e = await resp.json().catch(() => ({}));
            alert(`Failed to open terminal: ${((e.error || {}).message) || 'unknown error'}`);
          }
        } catch (_) {
          alert('Failed to open terminal: network error');
        }
      }
      function closeGraphMenu() { const m = document.getElementById("graph-node-menu"); if (m) m.remove(); }
      document.addEventListener("click", closeGraphMenu);
      function openTaskNodeMenu(e, runId, ti) {
        e.preventDefault(); e.stopPropagation(); closeGraphMenu();
        const r = findRun(runId); if (!r) return;
        const items = [`<div title="Re-run all sessions of this task from the first, and dirty every downstream run so it re-executes too. This cannot be undone." onclick="closeGraphMenu();restartRun('${runId}')">⟳ Restart task</div>`];
        const menu = document.createElement("div");
        menu.className = "ctx-menu"; menu.id = "graph-node-menu"; menu.innerHTML = items.join("");
        document.body.appendChild(menu);
        menu.style.left = Math.min(e.clientX, window.innerWidth - 220) + "px";
        menu.style.top = Math.min(e.clientY, window.innerHeight - 80) + "px";
      }
      function openSessionNodeMenu(e, runId, ti, si) {
        e.preventDefault(); e.stopPropagation(); closeGraphMenu();
        const r = findRun(runId); if (!r) return;
        const items = [`<div title="Re-run this session and everything downstream of it. Sessions upstream of this one remain done and are skipped. Dependent runs are dirtied too. This cannot be undone." onclick="closeGraphMenu();restartSession('${runId}',${ti},${si})">⟳ Restart session</div>`];
        const menu = document.createElement("div");
        menu.className = "ctx-menu"; menu.id = "graph-node-menu"; menu.innerHTML = items.join("");
        document.body.appendChild(menu);
        menu.style.left = Math.min(e.clientX, window.innerWidth - 220) + "px";
        menu.style.top = Math.min(e.clientY, window.innerHeight - 80) + "px";
      }
      async function deleteRun(id) {
        closeRunMenu();
        if (!confirm("Delete this run? This cannot be undone.")) return;
        await del(`/api/runs/${id}`);
        if (selectedRunId === id) selectedRunId = null;
        multiSel.delete(id); tick();
      }
      // selection tabs / bulk actions (multi mode)
      function focusSel(id) { selectedRunId = id; sel = { kind: "run", taskIdx: 0, sessionIdx: 0 }; editing = false; renderAll(); syncHash(); }
      function unpickSel(id) { multiSel.delete(id); if (selectedRunId === id) selectedRunId = [...multiSel][0] || null; renderAll(); }
      async function bulkCancel() { for (const id of [...multiSel]) { try { await post(`/api/runs/${id}/cancel`); } catch (_) {} } tick(); }
      async function bulkDelete() {
        if (!confirm(`Delete ${multiSel.size} run(s)? This cannot be undone.`)) return;
        for (const id of [...multiSel]) { try { await del(`/api/runs/${id}`); } catch (_) {} }
        multiSel.clear(); selectedRunId = null; tick();
      }
      function selectionTabs() {
        const chips = [...multiSel].map((id) => {
          const r = findRun(id); if (!r) return "";
          return `<span class="sel-tab ${id === selectedRunId ? "active" : ""}" onclick="focusSel('${id}')">${esc(r.label || id)}<span class="x" onclick="event.stopPropagation();unpickSel('${id}')">✕</span></span>`;
        }).join("");
        return `<div class="sel-tabs">${chips}</div>
          <div class="btn-row" style="margin-top:0"><button class="btn" onclick="bulkCancel()" data-tip="Cancel all selected runs — stops running sessions and marks them as cancelled.">Cancel ${multiSel.size}</button><button class="btn danger" onclick="bulkDelete()" data-tip="Delete all selected runs and their data permanently. This cannot be undone.">Delete ${multiSel.size}</button></div>`;
      }

      // A session's own verify steps (`[[task.session.verify]]`), listed under a
      // dashed separator inside the session card with a status dot each, so you
      // can see which verifier is running/passed/failed. Clicking one selects it
      // in the details pane. Empty = nothing to show.
      function sessionVerify(s, ti, si, selCls) {
        const vs = s.verify || [];
        if (!vs.length) return "";
        const rows = vs.map((v, vi) =>
          `<div class="sv-row selectable ${selCls("verify", ti, si, vi)}" data-tip="Session verify step: ${esc(v.kind)}${v.id ? " — " + esc(v.id) : ""}\nRuns after this session completes to validate its output.\nCurrent state: ${esc(v.state)}." onclick="event.stopPropagation();pick('verify',${ti},${si},${vi})">
             ${sdot(v.state)}<span class="sv-name">${esc(v.id || v.kind)}</span> ${pill(v.state)}${v.output ? `<button class="logs-btn" data-tip="View verifier output — the raw response from the AI verifier." data-full="${esc(v.output)}" onclick="event.stopPropagation();openCmdPopup(event)">📄</button>` : ""}</div>`).join("");
        return `<div class="sverify"><span class="label">verify</span>${rows}</div>`;
      }

      // ---------- center graph ----------
      function renderGraph() {
        const el = document.getElementById("graph");
        const run = findRun(selectedRunId);
        if (!run) { el.innerHTML = `<div class="empty">Select a run.</div>`; return; }
        const selCls = (k, t, s, v = -1) => {
          if (sel.kind !== k) return "";
          if (k === "run") return "sel";
          if (k === "task") return sel.taskIdx === t ? "sel" : "";
          if (k === "session") return (sel.taskIdx === t && sel.sessionIdx === s) ? "sel" : "";
          if (k === "verify") return (sel.taskIdx === t && sel.sessionIdx === s && (sel.verifyIdx ?? -1) === v) ? "sel" : "";
          return "";
        };
        const banner = `<div class="run-banner selectable ${sel.kind === "run" ? "sel" : ""}" onclick="pick('run')">
            ${sdot(run.state)}<span class="rid">${esc(run.label || run.id)}</span>${copyBtn(run.label || run.id)} ${pill(run.state)}${runLogsBtn(run.id)}
            <span style="flex:1"></span></div>`;
        const tasks = run.tasks.map((t, ti) => {
          const sessions = t.sessions.map((s, si) => `
            <div class="session selectable ${selCls("session", ti, si)}" id="n-${ti}-${si}" onclick="pick('session',${ti},${si})" oncontextmenu="openSessionNodeMenu(event,'${run.id}',${ti},${si})"
                 data-tip="${esc(s.name ?? s.id)} · ${esc(s.state)}\nAgent: ${esc(s.agent)}${s.model ? " · " + esc(s.model) : ""}${(s.depends_on||[]).length ? "\nDepends on: " + esc((s.depends_on||[]).join(", ")) : ""}\nClick to view details in the right pane. Right-click to restart.">
              <div class="sid">${esc(s.name ?? s.id)} ${pill(s.state)}${s.error ? failLogBtn(s.error) : ""}</div>
              <div class="kv">${esc(s.agent)}${s.model ? " · " + esc(s.model) : ""}</div>
              ${sessionVerify(s, ti, si, selCls)}
            </div>`).join("");
          const tverify = (t.verify || []).map((v, vi) => `<span class="vchip selectable ${selCls("verify", ti, -1, vi)}" id="v-${ti}-${vi}" data-tip="Task verify step: ${esc(v.kind)}${v.id ? " — " + esc(v.id) : ""}\nRuns after all sessions finish to validate the task result.\nState: ${esc(v.state)}." onclick="event.stopPropagation();pick('verify',${ti},-1,${vi})">${sdot(v.state)} ${esc(v.id || v.kind)}</span>`).join("");
          const tdep = (t.depends_on || []).length ? `<span class="k" style="font-size:11px" data-tip="This task depends on ${esc((t.depends_on||[]).join(", "))}.\nIt will not start until the upstream task(s) finish successfully.">⇠ ${esc((t.depends_on||[]).join(", "))}</span>` : "";
          return `<div class="task" id="tk-${ti}">
            <div class="task-head selectable ${selCls("task", ti)}" onclick="pick('task',${ti})" oncontextmenu="openTaskNodeMenu(event,'${run.id}',${ti})">${sdot(t.state)} <span>${esc(t.name)}</span> ${pill(t.state)} ${tdep}</div>
            <div class="task-body">${sessions || '<span class="kv">no sessions</span>'}</div>
            ${tverify ? `<div class="verify-chain"><span class="label">verify</span>${tverify}</div>` : ""}
          </div>`;
        }).join("");
        el.innerHTML = banner + tasks;
        requestAnimationFrame(drawArrows);
      }

      // ---------- SVG dependency arrows ----------
      const SVGNS = "http://www.w3.org/2000/svg";
      function drawArrows() {
        const graph = document.getElementById("graph");
        const existing = document.getElementById("arrow-svg");
        if (existing) existing.remove();
        const run = findRun(selectedRunId);
        if (!run) return;
        // Map every dependency reference (session id and "taskName/sessionId") to a node id.
        const byRef = {};
        run.tasks.forEach((t, ti) => t.sessions.forEach((s, si) => {
          byRef[s.id] = `n-${ti}-${si}`;
          byRef[`${t.name}/${s.id}`] = `n-${ti}-${si}`;
        }));
        const taskByName = {};
        run.tasks.forEach((t, ti) => { taskByName[t.name] = `tk-${ti}`; });
        const edges = [];
        // task -> task dependencies (routed card-to-card, in the gaps)
        run.tasks.forEach((t, ti) => (t.depends_on || []).forEach((dep) => {
          const from = taskByName[dep]; if (from) edges.push({ from, to: `tk-${ti}`, kind: "dep" });
        }));
        // session -> session dependencies
        run.tasks.forEach((t, ti) => t.sessions.forEach((s, si) => {
          (s.depends_on || []).forEach((dep) => {
            const from = byRef[dep]; if (from) edges.push({ from, to: `n-${ti}-${si}`, kind: "dep" });
          });
        }));
        // verify chain
        run.tasks.forEach((t, ti) => {
          const vs = t.verify || [];
          for (let i = 1; i < vs.length; i++) edges.push({ from: `v-${ti}-${i - 1}`, to: `v-${ti}-${i}`, kind: "vchain" });
        });
        if (!edges.length) return;
        const gr = graph.getBoundingClientRect();
        const rectOf = (id) => { const e = document.getElementById(id); return e ? e.getBoundingClientRect() : null; };
        const px = (r) => r.left - gr.left + graph.scrollLeft;
        const py = (r) => r.top - gr.top + graph.scrollTop;
        const svg = document.createElementNS(SVGNS, "svg");
        svg.id = "arrow-svg";
        svg.setAttribute("width", graph.scrollWidth);
        svg.setAttribute("height", graph.scrollHeight);
        // Above the cards (z-index 5 > card z-index 1) but click-through.
        svg.style.cssText = "position:absolute;left:0;top:0;pointer-events:none;z-index:5;overflow:visible";
        svg.innerHTML = `<defs>
          <marker id="ah-dep" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker>
          <marker id="ah-v" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--teal)"/></marker>
        </defs>`;
        // Anchor on the facing edges so the line travels in the gap, not across faces.
        const anchor = (a, b) => {
          const acx = px(a) + a.width / 2, acy = py(a) + a.height / 2;
          const bcx = px(b) + b.width / 2, bcy = py(b) + b.height / 2;
          const dx = bcx - acx, dy = bcy - acy;
          if (Math.abs(dx) > Math.abs(dy)) {
            return { x1: dx > 0 ? px(a) + a.width : px(a), y1: acy, x2: dx > 0 ? px(b) : px(b) + b.width, y2: bcy, h: true };
          }
          return { x1: acx, y1: dy > 0 ? py(a) + a.height : py(a), x2: bcx, y2: dy > 0 ? py(b) : py(b) + b.height, h: false };
        };
        edges.forEach((e) => {
          const a = rectOf(e.from), b = rectOf(e.to); if (!a || !b) return;
          const { x1, y1, x2, y2, h } = anchor(a, b);
          const d = h
            ? `M${x1},${y1} C${(x1 + x2) / 2},${y1} ${(x1 + x2) / 2},${y2} ${x2},${y2}`
            : `M${x1},${y1} C${x1},${(y1 + y2) / 2} ${x2},${(y1 + y2) / 2} ${x2},${y2}`;
          const p = document.createElementNS(SVGNS, "path");
          p.setAttribute("d", d);
          p.setAttribute("fill", "none");
          p.setAttribute("stroke", e.kind === "dep" ? "var(--muted)" : "var(--teal)");
          p.setAttribute("stroke-width", "1.75");
          p.setAttribute("opacity", "0.9");
          p.setAttribute("marker-end", e.kind === "dep" ? "url(#ah-dep)" : "url(#ah-v)");
          svg.appendChild(p);
        });
        graph.style.position = "relative";
        graph.appendChild(svg);
      }
      window.addEventListener("resize", () => requestAnimationFrame(drawArrows));
      function pick(kind, ti = 0, si = 0, vi = -1) { sel = { kind, taskIdx: ti, sessionIdx: si, verifyIdx: vi }; editing = false; renderGraph(); renderDetails(); syncHash(true); }

      function taskView(r, t) {

      function verifyView(r) {

      // CCTL-148: worktree (the session's own cwd) and project (its shared git

      async function loadRunPaths(id) {
        if (!id || runPaths[id]) return;

          const arr = await (await fetch(`/api/runs/${id}/worktrees`)).json();

      // CCTL-115: render each command line elided in a fixed-height box; a

      function startEdit() { editing = true; renderDetails(); }

      async function saveEdit() {

        else {

          // the session's pre-existing kind.

      // ---------- running dropdown ----------
      function toggleRunning(e) {

        const rows = [];

        for (const r of runs) {

            const t = r.tasks[ti];

              const runLabel = esc(r.label || r.id);
              rows.push(`<div onclick="gotoRunItem('${r.id}','session',${ti},${si},-1);document.getElementById('running-menu').classList.add('hidden')" data-tip="Running session in run ${runLabel}, task ${esc(t.name)}.\nClick to navigate directly to this session."><span class="pill p-running" style="font-size:10px;margin-right:4px">Session</span>${runLabel} / ${esc(t.name)}</div>`);
              // Session-level verifies
              for (let vi = 0; vi < (s.verify || []).length; vi++) {
                const v = s.verify[vi];

                rows.push(`<div onclick="gotoRunItem('${r.id}','verify',${ti},${si},${vi});document.getElementById('running-menu').classList.add('hidden')" data-tip="Running verify step in run ${runLabel}, task ${esc(t.name)}, session ${si}.\nClick to navigate directly to this verify step."><span class="pill p-running" style="font-size:10px;margin-right:4px">Verify</span>${runLabel} / ${esc(t.name)} / s${si} verify</div>`);

        }

      document.addEventListener("click", () => document.getElementById("running-menu").classList.add("hidden"));

      // ---------- new task modal ----------
      function openNewTask() {
        document.getElementById("modal-root").innerHTML = `
          <div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
            <h2>New Task</h2>
            <textarea id="nt-toml" placeholder="Paste task TOML here…" data-tip="Paste a TOML task definition here.\nSee docs/daemon-api.md for the full schema — at minimum you need [[task]] with a name and at least one [[task.session]]."></textarea>
            <label style="font-size:12px;color:var(--muted)" data-tip="Optional display label for this run — shown in the sidebar and board view. Defaults to the run ID if left blank.">label (optional) <input id="nt-label" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px"></label>

      }
      function closeModal() { document.getElementById("modal-root").innerHTML = ""; }

      // ---------- logs modal ----------
      let logRunId = null, logsTab = "sessions";
      let logEvents = {};   // runId -> events array (CCTL-99), lazily fetched
      function openLogs(id) { const r = findRun(id || selectedRunId); if (!r) return; logRunId = r.id; renderLogs(); }
      function openRunLogs(e, id) { e.stopPropagation(); openLogs(id); }
      function renderLogs() {
        const run = findRun(logRunId); if (!run) return;

          <div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="width:880px;max-width:94vw">

      async function loadLogEvents(id) {
        logEvents[id] = null; // loading
        try {
          logEvents[id] = await (await fetch(`/api/runs/${id}/logs`)).json();

      // Render an audit-log event list (shared by run + review log viewers).
      function eventsTable(events) {
        if (events === null || events === undefined) return `<div class="empty">Loading…</div>`;
        if (!events.length) return `<div class="empty">No events yet.</div>`;
        const T = (rows) => `<table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr>${["time","scope","ref","message"].map((h) => `<th style="text-align:left;padding:5px 10px;color:var(--muted);font-weight:500">${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>`;
        return T(events.map((e) => tblRow([
          new Date(e.at_ms).toLocaleTimeString(),
          `<span class="pill p-pending">${esc(e.scope)}</span>`,
          `<span class="mono">${esc(e.ref || "—")}</span>`,
          esc(e.message),
        ])));
      }
      function tblRow(cells) { return "<tr>" + cells.map((c) => `<td style="padding:5px 10px;border-bottom:1px solid var(--border)">${c}</td>`).join("") + "</tr>"; }
      function logsBody(run) {
        const T = (head, rows) => `<table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr>${head.map((h) => `<th style="text-align:left;padding:5px 10px;color:var(--muted);font-weight:500">${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>`;
        if (logsTab === "events") {
          return eventsTable(logEvents[run.id]);
        }
        if (logsTab === "tasks") {
          return T(["task", "state", "sessions"], run.tasks.map((t) => tblRow([esc(t.name), pill(t.state), t.sessions.length])));
        }
        if (logsTab === "verifiers") {
          const rows = [];
          const outBtn = (v) => v.output ? `<button class="btn" style="padding:1px 6px;font-size:11px" data-full="${esc(v.output)}" ondblclick="openCmdPopup(event)" onclick="openCmdPopup(event)">▶ output</button>` : "—";
          run.tasks.forEach((t) => {
            (t.verify || []).forEach((v) => rows.push(tblRow([esc(t.name), "task", esc(v.id || "—"), esc(v.kind), pill(v.state), outBtn(v)])));
            (t.sessions || []).forEach((s) => (s.verify || []).forEach((v) =>
              rows.push(tblRow([esc(t.name), `session ${esc(s.id)}`, esc(v.id || "—"), esc(v.kind), pill(v.state), outBtn(v)]))));
          });
          return rows.length ? T(["task", "scope", "id", "kind", "state", "output"], rows) : `<div class="empty">No verifiers.</div>`;
        }
        const rows = [];
        run.tasks.forEach((t) => t.sessions.forEach((s) => rows.push(tblRow([esc(t.name), `<span class="mono">${esc(s.id)}</span>`, pill(s.state), `${s.tokens_in}/${s.tokens_out}`, `$${(s.cost_usd || 0).toFixed(4)}`, s.error ? `<span style="color:var(--failed)">${esc(s.error)}</span>` : ""]))));
        return T(["task", "session", "state", "tokens", "cost", "error"], rows);
      }
      async function submitTask() {
        const toml = document.getElementById("nt-toml").value;
        const label = document.getElementById("nt-label").value;
        const errEl = document.getElementById("nt-err");
        const v = await (await fetch("/api/runs/validate", { method: "POST", body: JSON.stringify({ toml }) })).json();
        if (!v.valid) { errEl.innerHTML = v.errors.map((e) => `line ${e.line ?? "?"}: ${esc(e.message)}`).join("<br>"); return; }
        const resp = await fetch("/api/runs", { method: "POST", body: JSON.stringify({ toml, label: label || null }) });
        if (!resp.ok) { const b = await resp.json().catch(() => ({})); errEl.textContent = (b.error && b.error.message) || "submit failed"; return; }
        closeModal(); tick();
      }

      // ---------- reviews (list + detail, read-only for now) ----------
      const G_COLORS = { collecting:"--muted", merging:"--running", merge_failed:"--failed", in_review:"--accent", approved:"--done", cancelled:"--cancelled", deployed:"--done", pending:"--pending", in_progress:"--running", done:"--done", conflict_resolved:"--queued", failed:"--failed" };
      const gdot = (s) => `<span class="dot" style="background:${cvar(G_COLORS[s]||"--muted")}"></span>`;
      function selectGuardian(id) { selectedGuardian = id; syncHash(true); renderReviews(); renderReviewDetail(); }
      function renderReviews() {
        const el = document.getElementById("reviews");
        if (!guardians.length) { el.innerHTML = `<div class="empty">No reviews.</div>`; return; }
        el.innerHTML = guardians.map((g) => `<div class="run-item ${g.id===selectedGuardian?"selected":""}" onclick="selectGuardian('${g.id}')" oncontextmenu="openReviewMenu(event,'${g.id}')">
          <button class="btn runbtn" onclick="openReviewMenu(event,'${g.id}')" data-tip="Review actions — rename or delete this review.">⋯</button>
          <div class="rid">${esc(g.name)}</div><div class="meta">${gdot(g.status)}<span>${g.status}</span> · ${g.branches.length} branches</div></div>`).join("");
      }
      // CCTL-100: right-click a review for Rename / Delete (mirrors the run menu).
      function openReviewMenu(e, id) {
        e.preventDefault(); e.stopPropagation(); closeRunMenu();
        const g = guardians.find((x) => x.id === id); if (!g) return;
        const menu = document.createElement("div");
        menu.className = "ctx-menu"; menu.id = "run-menu";
        const canCancel = ["collecting","merging","approved"].includes(g.status);
        menu.innerHTML = `<div onclick="renameReview('${id}')" data-tip="Rename this review — changes the display name only.">✎ Rename</div>${canCancel ? `<div class="danger" onclick="cancelReview('${id}')" data-tip="Cancel this review — stops the current run and discards its result.\nThe review can be restarted afterward.\nThis cannot be undone.">⊘ Cancel review</div>` : ""}<div class="danger" onclick="deleteReview('${id}')" data-tip="Delete this review and remove all review worktrees permanently.\nThis cannot be undone.">🗑 Delete</div>`;
        document.body.appendChild(menu);
        menu.style.left = Math.min(e.clientX, window.innerWidth - 180) + "px";
        menu.style.top = Math.min(e.clientY, window.innerHeight - 90) + "px";
      }
      function renameReview(id) {
        closeRunMenu();
        const g = guardians.find((x) => x.id === id); if (!g) return;
        const name = prompt("Rename review:", g.name);
        if (name === null || !name.trim()) return;
        post(`/api/guardians/${id}/rename`, { name: name.trim() }).then(() => tick());
      }
      async function deleteReview(id) {
        closeRunMenu();
        const g = guardians.find((x) => x.id === id);
        if (!confirm(`Delete review "${g ? g.name : id}"? This removes its review worktrees and cannot be undone.`)) return;
        await del(`/api/guardians/${id}`);
        if (selectedGuardian === id) selectedGuardian = null;
        tick();
      }
      function openReviewTitleMenu(e, id) {
        e.preventDefault(); e.stopPropagation(); closeRunMenu();
        const g = guardians.find((x) => x.id === id); if (!g) return;
        const canCancel = ["collecting","merging","approved"].includes(g.status);
        const menu = document.createElement("div");
        menu.className = "ctx-menu"; menu.id = "run-menu";
        menu.innerHTML = canCancel
          ? `<div class="danger" onclick="cancelReview('${id}')" data-tip="Cancel this review — stops the current run and discards its result.\nThe review can be restarted afterward.\nThis cannot be undone.">⊘ Cancel review</div>`
          : `<div style="color:var(--muted);padding:6px 10px;font-size:12px" data-tip="No actions are available because this review's status is '${g.status}'.\nActions like Cancel are only available while the review is collecting, merging, or approved.">No actions available</div>`;
        document.body.appendChild(menu);
        menu.style.left = Math.min(e.clientX, window.innerWidth - 180) + "px";
        menu.style.top = Math.min(e.clientY, window.innerHeight - 90) + "px";
      }
      async function cancelReview(id) {
        closeRunMenu();
        const g = guardians.find((x) => x.id === id);
        if (!confirm(`Cancel review "${g ? g.name : id}"? The current run will be discarded. This cannot be undone.`)) return;
        await fetch(`/api/guardians/${id}/cancel`, { method: "POST" });
        tick();
      }
      function mergeProgress(g) {
        const total = g.branches.length;
        if (!total) return "";
        const cnt = (f) => g.branches.filter(f).length;
        const done = cnt((b) => b.merge_status === "done");
        const resolved = cnt((b) => b.merge_status === "conflict_resolved");
        const prog = cnt((b) => b.merge_status === "in_progress");
        const failed = cnt((b) => b.merge_status === "failed");
        const pct = (n) => (100 * n / total).toFixed(2) + "%";
        return `<div class="kv-row"><span class="k">merged</span><span>${done + resolved}/${total}${failed ? ` · <span style="color:var(--failed)">${failed} failed</span>` : ""}</span></div>
          <div class="progress" data-tip="Merge progress bar — green: clean merge, purple: conflict resolved by agent, blue: in progress, red: failed.">
            <span style="width:${pct(done)};background:var(--done)"></span>
            <span style="width:${pct(resolved)};background:var(--queued)"></span>
            <span style="width:${pct(prog)};background:var(--running)"></span>
            <span style="width:${pct(failed)};background:var(--failed)"></span>
          </div>`;
      }
      // CCTL-147: live merge-conflict resolution progress (resolved / total).
      function conflictProgress(g) {
        const total = g.conflicts_total;
        if (total === null || total === undefined || total <= 0) return "";
        const remaining = g.conflicts_remaining ?? total;
        const resolved = Math.max(0, total - remaining);
        const pct = (100 * resolved / total).toFixed(0);
        const active = g.status === "merging";
        return `<div class="kv-row"><span class="k">conflicts</span><span>${resolved}/${total} markers resolved${active && remaining > 0 ? " · resolving…" : ""}</span></div>
          <div class="progress" data-tip="Conflict resolution progress — the agent is working through merge conflicts in this review's stack.">
            <span style="width:${pct}%;background:var(--queued)"></span>
          </div>`;
      }
      function branchBadge(b) {
        if (b.merge_status === "failed") return `<span class="badge bad" data-tip="Merge failed — ${esc(b.detail || "conflict during rebase")}">⚠ conflict</span>`;
        if (b.merge_status === "conflict_resolved") return `<span class="badge warn2" data-tip="Conflict was resolved by the guardian agent — ${esc(b.detail || "resolved")}">✓ resolved</span>`;
        return "";
      }
      // Per-branch inline conflict progress bar (RAL-37).
      function branchConflictBar(b) {
        const total = b.conflicts_total;
        if (total === null || total === undefined || total <= 0) return "";
        const remaining = b.conflicts_remaining ?? total;
        const resolved = Math.max(0, total - remaining);
        const pct = (100 * resolved / total).toFixed(0);
        const isResolved = remaining === 0;
        const color = isResolved ? "var(--done)" : "var(--failed)";
        const icon = isResolved ? "✓" : "⚠";
        const label = `${resolved}/${total} markers resolved`;
        const tooltip = isResolved
          ? `All ${total} conflict marker${total === 1 ? "" : "s"} resolved by agent`
          : `${remaining} of ${total} conflict marker${total === 1 ? "" : "s"} still remaining`;
        return `<div class="branch-conflict-bar" title="${tooltip}">
          <div class="branch-conflict-label">
            <span class="conflict-icon" aria-label="${isResolved ? "resolved" : "unresolved"}">${icon}</span>
            <span>${label}${!isResolved ? " · resolving…" : ""}</span>
          </div>
          <div class="progress" style="margin:0">
            <span style="width:${pct}%;background:${color}"></span>
          </div>
        </div>`;
      }
      function renderChangeSummary(g) {
        if (g.change_summary) {
          return `<h3 class="section" data-tip="generated by the resolver agent from commit subject lines after each merge\nrecomputed whenever the review is rebuilt or feedback is applied">change summary</h3>
            <div style="font-size:13px;line-height:1.55;white-space:pre-wrap;border:1px solid var(--border);border-radius:6px;padding:10px 12px;background:var(--bg);color:var(--text)">${esc(g.change_summary)}</div>`;
        }
        if (g.status === "merging") {
          return `<h3 class="section" data-tip="summary is generated from commit subject lines after the merge completes">change summary</h3><div class="empty">generating summary…</div>`;
        }
        return "";
      }
      function renderReviewDetail() {
        const el = document.getElementById("review-detail");
        const g = guardians.find((x) => x.id === selectedGuardian);
        if (!g) { el.innerHTML = `<div class="empty">Select a review.</div>`; return; }
        // RAL-14: reorder is allowed while the review is still open — not once it
        // is approved/deployed (those branches are considered merged/shipped).
        const canReorder = !["approved", "cancelled", "deployed"].includes(g.status);
        const drag = canReorder ? `draggable="true" ondragstart="brDragStart(event)" ondragover="brDragOver(event)" ondragleave="brDragLeave(event)" ondrop="brDrop(event,'${g.id}')" ondragend="brDragEnd(event)"` : "";
        // Staged reorder + enable state (RAL-6, RAL-43): pendingReorder holds both
        // the branch order and per-branch enabled flags, committed only on Save.
        // All pre-save changes are local UI state — nothing hits the server until
        // Save, which persists both order and enabled states, then kicks off the
        // rebase. Discard reverts to the last server-side state.
        const serverOrder = g.branches.map((b) => b.branch);
        const serverEnabled = Object.fromEntries(g.branches.map((b) => [b.branch, b.enabled !== false]));
        const hasPending = !!(pendingReorder && pendingReorder.gid === g.id);
        const stagedOrder = hasPending ? pendingReorder.order : serverOrder;
        const stagedEnabled = (hasPending && pendingReorder.enabled) ? pendingReorder.enabled : serverEnabled;
        const byBranch = Object.fromEntries(g.branches.map((b) => [b.branch, b]));
        const orderedBranches = stagedOrder.map((n) => byBranch[n]).filter(Boolean);
        // RAL-29: multi-project tab view — filter branches to the active project tab.
        const isMultiProject = g.projects && g.projects.length > 1;
        const activeTab = isMultiProject
          ? (selectedProjectTabs[g.id] && g.projects.includes(selectedProjectTabs[g.id])
              ? selectedProjectTabs[g.id] : g.projects[0])
          : null;
        const visibleBranches = isMultiProject
          ? orderedBranches.filter((b) => (b.project || g.git_root) === activeTab)
          : orderedBranches;
        // RAL-43: warn when all branches are staged as disabled.
        const enabledCount = visibleBranches.filter((b) => stagedEnabled[b.branch] !== false).length;
        const allDisabled = visibleBranches.length > 0 && enabledCount === 0;
        const branches = visibleBranches.map((b, i) => {
          const isEnabled = stagedEnabled[b.branch] !== false;
          const hasDetail = !!(b.worktree || b.detail);
          const open = expandedBranches.has(`${g.id}:${b.position}`);
          const toggle = hasDetail
            ? `<span class="br-toggle" data-tip="Expand or collapse merge detail for this branch." onclick="toggleBranch(event,'${g.id}',${b.position})">${open ? "▾" : "▸"}</span>`
            : `<span class="br-toggle placeholder">▸</span>`;
          const detail = hasDetail ? `<div class="branch-detail ${open ? "" : "hidden"}">
              ${b.detail ? `<div class="kv-row" style="margin:0 0 4px"><span class="k" style="text-transform:none;letter-spacing:0">status</span><span class="v" style="font-size:12px">${esc(b.detail)}</span></div>` : ""}
              ${b.worktree ? `<div class="kv-row" style="margin:0"><span class="k" style="text-transform:none;letter-spacing:0">review worktree</span><span class="v mono" style="font-size:11px">${esc(b.worktree)}</span></div>
                <div class="row" style="margin:4px 0 0">
                  <input type="text" id="fb-${b.position}" placeholder="reviewer feedback for this branch…" style="flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 8px;font-size:12px">
                  <button class="btn" onclick="sendFeedback('${g.id}',${b.position})" data-tip="Send reviewer feedback for this specific branch.\nThe guardian agent routes it to the session that owns this branch.">Send feedback</button>
                </div>` : ""}
            </div>` : "";
          // RAL-43: enable/disable toggle — staged like drag-reorder, takes effect on Save.
          const enableToggle = canReorder
            ? `<button class="icon-btn" onclick="toggleBranchEnabled('${g.id}','${esc(b.branch)}')" title="${isEnabled ? 'Drop this branch from the rebase stack — it stays visible and can be re-enabled. Staged: takes effect on Save.' : 'Re-enable this branch — it will be included in the rebase stack again. Staged: takes effect on Save.'}" style="font-size:11px;padding:1px 5px;border-color:${isEnabled ? 'var(--border)' : 'var(--queued)'};color:${isEnabled ? 'var(--muted)' : 'var(--queued)'}">${isEnabled ? '⊙' : '⊘'}</button>`
            : "";
          return `
          <div class="branch-item"${isEnabled ? "" : ' style="opacity:0.45"'}>
            <div class="branch-row" data-branch="${esc(b.branch)}" ${drag}>
              ${canReorder ? '<span class="grip" data-tip="Drag to reorder branches — the merge order determines the rebase stack.">⋮⋮</span>' : ""}
              ${toggle}
              <span>${gdot(b.merge_status)}</span>
              <span class="mono" style="flex:1${isEnabled ? "" : ";color:var(--muted)"}">${esc(b.branch)}</span>
              ${isEnabled ? `${branchBadge(b)} ${pill(b.merge_status)}` : '<span class="badge" style="color:var(--muted);border-color:var(--border);font-size:11px">disabled</span>'}
              ${enableToggle}
            </div>
            ${branchConflictBar(b)}
            ${detail}
          </div>`;
        }).join("");
        const checks = g.checks.length
          ? `<div class="row"${g.skip_checks ? ' style="opacity:.45"' : ""}>${g.checks.map((c) => `<span class="vchip" data-tip="Check gate — runs after each merge commit and on the combined review worktree.\nAll gates must pass before the review can be approved.">🔒 <span class="mono">${esc(c)}</span></span>`).join("")}</div>`
          : "—";
        const skipChecks = `<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:6px" data-tip="Skip running the configured check gates (e.g. cargo test).\nUseful while iterating — gates are still listed but not executed.">
            <input type="checkbox" ${g.skip_checks ? "checked" : ""} onchange="setSkipChecks('${g.id}',this.checked)">skip build/check verification${g.skip_checks && g.checks.length ? ' — <span style="color:var(--queued)">gates will be skipped</span>' : ""}</label>
          <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:4px" data-tip="Build the entire branch stack in one shared worktree instead of isolated per-branch worktrees.\nFaster for large repos but gives less isolation between branches.">
            <input type="checkbox" ${g.skip_worktrees ? "checked" : ""} onchange="setSkipWorktrees('${g.id}',this.checked)">skip per-branch worktrees (build the stack in one shared worktree)</label>`;
        // Conflict-resolver backend/model for this review. Unset shows the
        // effective fallback (ollama / qwen3:8b) muted as "(default)".
        const rAgent = g.resolver_agent || "ollama";
        const rModel = g.resolver_model || (rAgent === "ollama" ? "qwen3:8b" : "backend default");
        const rIsDefault = !g.resolver_agent && !g.resolver_model;
        const resolverRow = `<div class="kv-row"><span class="k">resolver</span><span class="v">${esc(rAgent)} · <span class="mono">${esc(rModel)}</span>${rIsDefault ? ' <span style="opacity:.55">(default)</span>' : ""}</span></div>`;
        // RAL-22: a global feedback chat — a persisted triage thread for the whole

                <label data-tip="Shell commands to run as check gates after each merge commit (comma-separated). Leave blank to skip gates. Example: cargo test, npm test">checks (comma-separated shell commands, optional)<input id="cr-checks" placeholder="cargo test"></label>
                <label style="display:flex;align-items:center;gap:6px;margin-top:10px" data-tip="Skip running check gates during this review. Gates are still stored — you can re-enable them later."><input type="checkbox" id="cr-skip-checks" style="width:auto;margin:0">skip build/check verification</label>
                <label style="display:flex;align-items:center;gap:6px;margin-top:6px" data-tip="Use one shared worktree for the entire stack instead of per-branch worktrees. Faster for large repos."><input type="checkbox" id="cr-skip-worktrees" style="width:auto;margin:0">skip per-branch worktrees (large repos)</label>
              </div>
              <div id="cr-other-fields" class="hidden"><div class="empty" style="margin:12px 0">No extra fields for this review type yet.</div></div>
            </div>
            <div id="cr-err" class="verr"></div>
            <div class="btn-row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createReview()">Create</button></div>
          </div></div>`;
      }
      // CCTL-112: reviews are schema-based; the type dropdown toggles which
      // fields are shown (git-specific fields for `git`, a generic state else).
      function onReviewTypeChange() {
        const isGit = document.getElementById("cr-type").value === "git";
        document.getElementById("cr-git-fields").classList.toggle("hidden", !isGit);
        document.getElementById("cr-other-fields").classList.toggle("hidden", isGit);
      }
      async function createReview() {
        const v = (id) => document.getElementById(id).value.trim();
        const review_type = document.getElementById("cr-type").value;
        if (review_type !== "git") {
          document.getElementById("cr-err").textContent = "only git reviews can be created here for now";
          return;
        }
        const checks = v("cr-checks") ? v("cr-checks").split(",").map((s) => s.trim()).filter(Boolean) : [];
        const skip_checks = document.getElementById("cr-skip-checks").checked;
        const skip_worktrees = document.getElementById("cr-skip-worktrees").checked;
        const body = { name: v("cr-name"), review_type, base_branch: v("cr-base"), git_root: v("cr-root"), checks, skip_checks, skip_worktrees };
        if (!body.git_root) { document.getElementById("cr-err").textContent = "git root is required"; return; }
        const resp = await fetch("/api/guardians", { method: "POST", body: JSON.stringify(body) });
        if (!resp.ok) { document.getElementById("cr-err").textContent = "create failed"; return; }
        const g = await resp.json(); selectedGuardian = g.id; closeModal(); tick();
      }
      async function setSkipChecks(id, skip) {
        await fetch(`/api/guardians/${id}/settings`, { method: "POST", body: JSON.stringify({ skip_checks: skip }) });
        tick();
      }
      async function setSkipWorktrees(id, skip) {
        await fetch(`/api/guardians/${id}/settings`, { method: "POST", body: JSON.stringify({ skip_worktrees: skip }) });
        tick();
      }
      async function mergeReview(id, status) {
        if (status === "in_review" || status === "merging") {
          if (!confirm("There is a rebase currently in progress. Do you want to cancel it and start another?")) return;
          await fetch(`/api/guardians/${id}/cancel_and_merge`, { method: "POST" });
        } else {
          await fetch(`/api/guardians/${id}/merge`, { method: "POST" });
        }
        tick();
      }
      async function approveReview(id) { await fetch(`/api/guardians/${id}/approve`, { method: "POST" }); tick(); }

      // ---------- manual review commands (RAL-27) ----------
      function toggleManualMenu(id) {
        manualMenuOpen[id] = !manualMenuOpen[id];
        renderReviewDetail();
      }
      async function runAllManualChecks(id) {
        await fetch(`/api/guardians/${id}/run-manual-commands`, { method: "POST", body: "{}" });
      }
      async function runSingleManualCheck(id, index) {
        manualMenuOpen[id] = false;
        renderReviewDetail();
        await fetch(`/api/guardians/${id}/run-manual-commands`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ index }),
        });
      }

      // ---------- review-ready banner (CCTL-145) ----------
      // A guardian in `in_review` has its stack built and all check gates passed —
      // the "ready to act on" signal. Show a dismissible banner that jumps to it.
      function renderReadyBanner() {
        const el = document.getElementById("ready-banner");
        if (!el) return;
        const ready = (guardians || []).filter((g) => g.status === "in_review" && !dismissedReady.has(g.id));
        el.innerHTML = ready.map((g) => `<div class="ready-banner">
            <span>✅ Review <b>${esc(g.name)}</b> is ready.</span>
            <a href="#" onclick="gotoReview('${g.id}');return false" data-tip="Open this review on the Reviews tab to approve or inspect it.">Open review →</a>
            <span style="flex:1"></span>
            <button class="icon-btn" onclick="dismissReady('${g.id}')" data-tip="Dismiss this banner. You can still open the review from the Reviews tab.">✕</button>
          </div>`).join("");
      }
      function dismissReady(id) {
        dismissedReady.add(id);
        localStorage.setItem("ralphus-dismissed-ready", JSON.stringify([...dismissedReady]));
        renderReadyBanner();
      }
      async function refreshBanner() {
        // On the reviews tab `guardians` is already fresh; elsewhere fetch it.
        if (tab !== "reviews") { try { guardians = await (await fetch("/api/guardians")).json(); } catch (_) {} }
        if (!userIsSelecting()) renderReadyBanner();
      }

      // ---------- polling ----------
      // Wraps a renderFn call with smart scroll for #chat-thread: if the user
      // was at the bottom before render and a new message arrived, scrolls to
      // the top of that new message. Otherwise leaves scroll position alone.
      function applyChatSmartScroll(renderFn) {
        const ct = document.getElementById("chat-thread");
        const oldCount = ct ? ct.querySelectorAll(".chat-msg").length : 0;
        let atBottom = false;
        if (ct) {
          const lastEl = ct.lastElementChild;
          const threshold = (lastEl && lastEl.offsetHeight) || 30;
          atBottom = ct.scrollTop + ct.clientHeight >= ct.scrollHeight - threshold;
        }
        renderFn();
        const newCt = document.getElementById("chat-thread");
        if (!newCt || !atBottom) return;
        const newMsgs = newCt.querySelectorAll(".chat-msg");
        if (newMsgs.length > oldCount) {
          newCt.scrollTop = newMsgs[oldCount].offsetTop;
        } else {
          newCt.scrollTop = newCt.scrollHeight;
        }
      }
      // RAL-7: the 2s poll re-renders panes via `el.innerHTML = …`, which resets
      // scroll position and wipes in-progress text in a pane's inputs. Captures
      // the user's scroll position and focused field beforehand and restores them
      // after render — live updates keep flowing without clobbering typing.
      function preserveUserState(el, render) {
        if (!el) { render(); return; }
        const active = document.activeElement;
        const focused = active && el.contains(active) && active.id ? active : null;
        const fId = focused ? focused.id : null;
        const fVal = focused && "value" in focused ? focused.value : null;
        const fStart = focused && "selectionStart" in focused ? focused.selectionStart : null;
        const fEnd = focused && "selectionEnd" in focused ? focused.selectionEnd : null;
        // `el` survives the innerHTML swap (only its children are replaced), so
        // keep the ref; descendant scrollers are recreated, so re-find by id.
        const scrolls = [];
        if (el.scrollTop) scrolls.push([el, el.scrollTop]);
        el.querySelectorAll("[id]").forEach((n) => { if (n.scrollTop) scrolls.push([n.id, n.scrollTop]); });
        render();
        for (const [ref, top] of scrolls) {
          const n = typeof ref === "string" ? document.getElementById(ref) : ref;
          if (n) n.scrollTop = top;
        }
        if (fId) {
          const n = document.getElementById(fId);
          if (n) {
            if (fVal != null && "value" in n) n.value = fVal;
            n.focus({ preventScroll: true });
            if (fStart != null && n.setSelectionRange) { try { n.setSelectionRange(fStart, fEnd); } catch (_) {} }
          }
        }
      }
      // RAL-7 (follow-up): an innerHTML swap also destroys an active text
      // selection — highlighting a read-only worktree path or prompt text gets
      // wiped every tick. While the user has a live selection (a DOM range, or a
      // non-collapsed range inside a focused input/textarea) anywhere on the
      // page, skip the periodic re-renders entirely so the selection survives;
      // the next tick after they release it refreshes normally.
      function userIsSelecting() {
        const a = document.activeElement;
        if (a && "selectionStart" in a && a.selectionStart != null && a.selectionStart !== a.selectionEnd) return true;
        const s = window.getSelection && window.getSelection();
        return !!(s && !s.isCollapsed && String(s).length);
      }
      function renderAll() { renderRuns(); renderGraph(); preserveUserState(document.getElementById("details"), renderDetails); }
      async function tick() {
        if (tab === "reviews") await pollReviews();
        else if (tab === "resources") await pollResources();
        else await pollTasks();
        await refreshBanner();
      }
      async function pollTasks() {
        try {
          const d = await (await fetch("/api/tasks")).json();
          document.getElementById("conn").className = "dot on";
          window._daemonStatus = d.daemon;
          document.getElementById("running").textContent = `Running ${d.daemon.running ?? 0} / ${d.daemon.max_concurrent ?? 0}`;
          document.getElementById("updated").textContent = "updated " + new Date().toLocaleTimeString();
          runs = d.runs || [];
          if (pendingHash && pendingHash.runId && findRun(pendingHash.runId)) {
            const want = pendingHash; pendingHash = null;
            selectedRunId = want.runId;
            if (want.sel) { const [k, ti, si, vi] = want.sel.split(":"); sel = { kind: k, taskIdx: +ti || 0, sessionIdx: +si || 0, verifyIdx: vi !== undefined ? +vi : -1 }; }
            else sel = { kind: "run", taskIdx: 0, sessionIdx: 0 };
            renderSortChips(); renderStatusFilters(); renderAll();
          } else if (!selectedRunId && runs.length) { pendingHash = null; selectRun(runs[0].id); }
          else if (userIsSelecting()) { /* keep the user's text selection intact */ }
          else if (!editing) renderAll();
          else renderRuns();
        } catch (e) { document.getElementById("conn").className = "dot off"; document.getElementById("updated").textContent = "daemon unreachable"; }
      }
      async function pollReviews() {
        try {
          guardians = await (await fetch("/api/guardians")).json();
          document.getElementById("conn").className = "dot on";
          if (pendingHash && pendingHash.tab === "reviews") {
            if (pendingHash.guardianId) selectedGuardian = pendingHash.guardianId;
            pendingHash = null;
          }
          if (!selectedGuardian && guardians.length) selectedGuardian = guardians[0].id;
          syncHash();  // keep URL in sync with selectedGuardian (replaceState)
          // Keep the selected review's feedback thread fresh (RAL-22) so the
          // guardian's async replies appear without a manual refresh.
          if (selectedGuardian) await loadReviewMessages(selectedGuardian, { silent: true });
          if (!userIsSelecting()) { renderReviews(); applyChatSmartScroll(() => preserveUserState(document.getElementById("review-detail"), renderReviewDetail)); }
        } catch (e) { document.getElementById("conn").className = "dot off"; }
      }

      // ---------- resource usage (RAL-11) ----------
      async function pollResources() {
        try {
          const d = await (await fetch("/api/resources")).json();
          document.getElementById("conn").className = "dot on";
          document.getElementById("updated").textContent = "updated " + new Date().toLocaleTimeString();
          resources = d.resources || [];
          if (!userIsSelecting()) renderResources();
        } catch (e) { document.getElementById("conn").className = "dot off"; document.getElementById("updated").textContent = "daemon unreachable"; }
      }
      const RES_COLS = [
        { key: "task", label: "Task", tip: "Task name and session ID. Click to sort alphabetically.", get: (r) => (r.task_name || "") + " / " + (r.session_id || "") },
        { key: "cpu", label: "CPU", tip: "CPU usage of the runner process and its children. Click to sort — highest first.", get: (r) => r.cpu_percent },
        { key: "ram", label: "RAM", tip: "RAM usage of the runner process and its children. Click to sort — highest first.", get: (r) => r.mem_bytes },
        { key: "gpu", label: "GPU", tip: "GPU memory usage. Only available if the process uses CUDA/ROCm. Click to sort — highest first.", get: (r) => r.gpu_mem_bytes },
      ];
      const fmtPct = (v) => v == null ? "N/A" : v.toFixed(1) + "%";
      const fmtBytes = (v) => {
        if (v == null) return "N/A";
        const u = ["B", "KB", "MB", "GB", "TB"];
        let i = 0, n = v;
        while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
        return (i === 0 ? n : n.toFixed(1)) + " " + u[i];
      };
      function setResSort(key) {
        if (resSort.key === key) resSort.dir *= -1;
        else resSort = { key, dir: key === "task" ? 1 : -1 };
        renderResources();
      }
      function sortedResources() {
        const col = RES_COLS.find((c) => c.key === resSort.key) || RES_COLS[1];
        return [...resources].sort((a, b) => {
          const va = col.get(a), vb = col.get(b);
          // Missing metrics (N/A) always sort to the bottom regardless of direction.
          if (va == null && vb == null) return 0;
          if (va == null) return 1;
          if (vb == null) return -1;
          const cmp = typeof va === "string" ? va.localeCompare(vb) : va - vb;
          return resSort.dir * cmp;
        });
      }
      function renderResources() {
        const el = document.getElementById("resources");
        document.getElementById("res-summary").textContent =
          `${resources.length} running ${resources.length === 1 ? "task" : "tasks"}`;
        if (!resources.length) { el.innerHTML = `<div class="empty">No running tasks.</div>`; return; }
        const arrow = (key) => resSort.key === key ? (resSort.dir < 0 ? " ↓" : " ↑") : "";
        const head = RES_COLS.map((c) =>
          `<th class="${resSort.key === c.key ? "sorted" : ""}" onclick="setResSort('${c.key}')" data-tip="${esc(c.tip)}">${c.label}${arrow(c.key)}</th>`
        ).join("") + `<th data-tip="Jump to the session in the Tasks tab."></th>`;
        const rows = sortedResources().map((r) => `<tr>
            <td>${esc(r.task_name)} <span style="color:var(--muted)">/ ${esc(r.session_id)}</span><div style="color:var(--muted);font-size:11px">${esc(r.run_label || r.run_id)} · pid ${r.pid}</div></td>
            <td>${fmtPct(r.cpu_percent)}</td>
            <td>${fmtBytes(r.mem_bytes)}</td>
            <td>${fmtBytes(r.gpu_mem_bytes)}</td>
            <td><button class="res-jump" onclick="jumpToTask('${esc(r.run_id)}',${r.task_idx},${r.session_idx})" data-tip="Switch to the Tasks tab and scroll to this exact running session.">Go to task →</button></td>
          </tr>`).join("");
        el.innerHTML = `<table class="res-table"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
      }
      // Jump straight to the exact running session in the Tasks tab and scroll to it.
      function jumpToTask(runId, ti, si) {
        if (findRun(runId)) {
          selectedRunId = runId;
          sel = { kind: "session", taskIdx: +ti, sessionIdx: +si, verifyIdx: -1 };
          editing = false;
        } else {
          pendingHash = { runId, sel: `session:${ti}:${si}` };
        }
        showTab("tasks", true);
        setTimeout(() => document.getElementById(`n-${ti}-${si}`)?.scrollIntoView({ behavior: "smooth", block: "center" }), 120);
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
        else if ((e.key === "l" || e.key === "L") && tab === "tasks" && !/input|textarea/i.test((e.target.tagName || ""))) openLogs();
      });
      window.addEventListener("popstate", () => {
        _inPopstate = true;
        try {
          const h = parseHash();
          if (!h || h.tab === "tasks") {
            if (h && h.runId) {
              if (findRun(h.runId)) {
                selectedRunId = h.runId;
                if (h.sel) { const [k, ti, si, vi] = h.sel.split(":"); sel = { kind: k, taskIdx: +ti || 0, sessionIdx: +si || 0, verifyIdx: vi !== undefined ? +vi : -1 }; }
                else sel = { kind: "run", taskIdx: 0, sessionIdx: 0 };
              } else { pendingHash = h; }
            }
            renderSortChips(); renderStatusFilters();
            showTab("tasks");
          } else if (h.tab === "reviews") {
            if (h.guardianId) selectedGuardian = h.guardianId;
            showTab("reviews");
          } else if (h.tab === "resources") {
            showTab("resources");
          }
        } finally {
          _inPopstate = false;
        }
      });
      pendingHash = parseHash();
      renderStatusFilters(); renderSortChips();
      if (pendingHash && pendingHash.tab === "reviews") { showTab("reviews"); }  // keep pendingHash for pollReviews to apply guardianId
      else if (pendingHash && pendingHash.tab === "resources") { pendingHash = null; showTab("resources"); }
      else { tick(); }
      setInterval(tick, 2000);
    </script>
  </body>
</html>

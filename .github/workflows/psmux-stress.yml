name: psmux stress

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

concurrency:
  group: psmux-stress
  cancel-in-progress: false

jobs:
  concurrent-psmux:
    name: Concurrent Windows psmux tests
    runs-on: windows-latest
    env:
      PSMUX_VERSION: v3.3.8
      PSMUX_X64_SHA256: 1ad127ba937194a890b933a73d9b023e297bd73dc742abd841bf159984c2effe
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Install pinned psmux release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP "psmux-$env:PSMUX_VERSION-windows-x64.zip"
          $installDir = Join-Path $env:RUNNER_TEMP 'psmux-bin'
          $url = "https://github.com/psmux/psmux/releases/download/$env:PSMUX_VERSION/psmux-$env:PSMUX_VERSION-windows-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:PSMUX_X64_SHA256) {
            throw "psmux archive checksum mismatch: expected $env:PSMUX_X64_SHA256, got $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $installDir
          $tmux = Get-ChildItem -LiteralPath $installDir -Filter tmux.exe -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $tmux) { throw 'psmux archive did not contain tmux.exe' }
          $binDir = Split-Path -Parent $tmux
          $dataDir = Join-Path $env:RUNNER_TEMP "psmux-stress-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $dataDir | Out-Null
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "RALPHUS_TMUX_CMD=$tmux" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PSMUX_DATA_DIR=$dataDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PSMUX_CONFIG_FILE=NUL" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify psmux installation
        shell: pwsh
        run: '& $env:RALPHUS_TMUX_CMD --version'
      # This is deliberately separate from the per-PR serial job: it lets
      # independent test processes compete for one isolated psmux server and
      # catches shared-server races without involving a developer's live stack.
      - name: Run real psmux tests concurrently
        run: cargo nextest run --package ralphus-daemon --lib --run-ignored only --test-threads num-cpus --no-tests fail --filter-expr 'test(live_tmux)'
      - name: Repeat HTTP concurrency coverage
        shell: pwsh
        run: |
          1..10 | ForEach-Object {
            cargo nextest run --package ralphus-daemon --test http_concurrency
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Stop isolated psmux server
        if: always()
        continue-on-error: true
        shell: pwsh
        run: '& $env:RALPHUS_TMUX_CMD kill-server'

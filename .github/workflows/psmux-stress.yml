name: psmux stress

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

concurrency:
  group: psmux-stress
  cancel-in-progress: false

jobs:
  concurrent-psmux:
    name: Concurrent Windows psmux tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            vendor/psmux -> target
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Build vendored psmux (vendor/psmux submodule, RAL-347)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --manifest-path vendor/psmux/Cargo.toml --bin tmux
          $tmux = (Resolve-Path 'vendor/psmux/target/release/tmux.exe').Path
          $dataDir = Join-Path $env:RUNNER_TEMP "psmux-stress-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $dataDir | Out-Null
          "RALPHUS_TMUX_CMD=$tmux" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PSMUX_DATA_DIR=$dataDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PSMUX_CONFIG_FILE=NUL" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify psmux installation
        shell: pwsh
        run: '& $env:RALPHUS_TMUX_CMD --version'
      # This is deliberately separate from the per-PR serial job: it lets
      # independent test processes compete for one isolated psmux server and
      # catches shared-server races without involving a developer's live stack.
      - name: Run real psmux tests concurrently
        run: cargo nextest run --package ralphus-daemon --lib --run-ignored only --test-threads num-cpus --no-tests fail --filter-expr 'test(live_tmux)'
      - name: Repeat HTTP concurrency coverage
        shell: pwsh
        run: |
          1..10 | ForEach-Object {
            cargo nextest run --package ralphus-daemon --test http_concurrency
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      # WS-G.5: the store under sustained concurrent load, for longer than the
      # per-PR gate runs it. The captured deadlock took 108 seconds to appear
      # from a clean start, so a 4-second window is not where it would show up.
      #
      # RALPHUS_REPLAY_SECONDS lengthens `workload_replay`'s window (see that
      # file's module doc comment). A green run here is weak evidence -- runs
      # preceding the captured deadlock did not hang either -- so read a failure
      # as informative and a pass as "no regression observed", never as proof of
      # deadlock freedom.
      - name: Soak the store under the recorded workload
        env:
          RALPHUS_REPLAY_SECONDS: "120"
        run: cargo nextest run --package ralphus-daemon --test workload_replay --run-ignored only --test-threads 1
      - name: Repeat the board contention gate
        shell: pwsh
        run: |
          1..5 | ForEach-Object {
            cargo nextest run --package ralphus-daemon --test board_contention --run-ignored only --test-threads 1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Stop isolated psmux server
        if: always()
        continue-on-error: true
        shell: pwsh
        run: '& $env:RALPHUS_TMUX_CMD kill-server'

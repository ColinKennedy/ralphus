name: CI

on:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets

  web:
    name: Web (eslint + tsc --checkJs + knip + node --test on board.html)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+: `node --test "<glob>"` expands the pattern itself, so the test
          # script behaves identically under sh here and cmd.exe on Windows.
          node-version: "22"
      - name: Install lint deps
        run: npm install --no-audit --no-fund
      - name: ESLint (inline board.html JS, incl. JSDoc coverage)
        run: npx eslint librarian/assets/board.html
      - name: Type-check board.html's JSDoc-annotated JS (tsc --checkJs)
        run: npm run typecheck
      - name: Knip (dead code / unused deps)
        run: npm run knip
      - name: Unit tests (board.html's pure peek state machine)
        run: npm test

  python:
    name: Python (ruff, mypy --strict, privata, deadcode, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format check)
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy
      - name: privata (module privacy)
        run: |
          uv run privata src
          uv run privata tests
      - name: deadcode
        run: uv run deadcode src tests
      - name: pytest
        run: uv run pytest

  bench-patience:
    name: Bench patience comment lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check bench patience comments
        run: python scripts/check_bench_patience_comments.py

  docs:
    name: Docs (screenshot coverage lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Every board.html tab has a screenshot
        run: uv run ralphus-docs-lint
      - name: cli-reference.md help-map is up to date (RAL-110)
        run: uv run ralphus-docs-helpmap --check

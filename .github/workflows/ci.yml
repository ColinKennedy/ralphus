name: CI

on:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# RAL-260: python runs as a 3.11/3.12/3.13 + floating "3" matrix; rust runs its
# full suite on linux+windows plus a pinned 1.86 MSRV build-only leg. RAL-398
# adds a macOS leg -- experimental, so build-only rather than the full suite
# (see "Platform support" in README.md and docs/dependencies.md). RAL-441
# completes the platform picture: every rust check-name states the OS and
# configuration explicitly, and the rust work is split into a `rust-debug`
# job (full fmt/clippy/test suite on ubuntu+windows, MSRV verification, macOS
# smoke build) followed -- via `rust-release`'s `needs: rust-debug` edge -- by
# a release job whose per-OS legs compile the whole workspace in `--release`
# and package through the platform-appropriate product script
# (scripts/build-release.sh on Linux/macOS, scripts/build-release.cmd on
# Windows), then smoke-launch the packaged binaries. Debug therefore always
# runs before release on every OS, and a platform-specific release failure
# surfaces on the PR rather than at release time.

jobs:
  rust-debug:
    name: Rust debug (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        # toolchain x OS for debug builds. The floating `stable` legs run the
        # full fmt/clippy/test suite on both ubuntu and windows so the
        # documented Windows-specific daemon/runner paths are covered (see
        # .agent/gotchas.md). The pinned "1.86" MSRV leg only proves the
        # workspace still builds at the minimum supported toolchain; lint/test
        # drift is stable's job. The macOS leg (RAL-398) is deliberately
        # minimal -- debug build only, not the full suite -- since macOS
        # support is experimental and there's no real macOS hardware in CI to
        # validate a heavier leg against.
        include:
          - os: ubuntu-latest
            toolchain: stable
            suite: full
            label: ubuntu · stable · fmt/clippy/test
          - os: windows-latest
            toolchain: stable
            suite: full
            label: windows · stable · fmt/clippy/test
          - os: ubuntu-latest
            toolchain: "1.86"
            suite: msrv
            label: ubuntu · 1.86 · MSRV debug build
          - os: macos-latest
            toolchain: stable
            suite: macos-debug
            label: macos · stable · debug build
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        if: matrix.suite == 'full'
        uses: taiki-e/install-action@nextest
      - name: Format check
        if: matrix.suite == 'full'
        run: cargo "+${{ matrix.toolchain }}" fmt --all -- --check
      - name: Clippy
        if: matrix.suite == 'full'
        run: cargo "+${{ matrix.toolchain }}" clippy --all-targets -- -D warnings
      # PR_SLOWNESS.local.md: nextest schedules each test as its own process
      # instead of cargo test's default, which matters a lot here since most
      # of the daemon suite is real-git-subprocess-heavy (measured ~80%
      # faster wall-clock on the same tests, no code changes). nextest does
      # not run doctests, so that's a separate step below -- this workspace
      # has none that execute today (everything under `/// ```...``` ` is
      # `text`/`ignore`-fenced), so it's cheap insurance against a future one
      # going unchecked rather than covering a present gap.
      - name: Test
        if: matrix.suite == 'full'
        run: cargo "+${{ matrix.toolchain }}" nextest run --workspace --all-targets
      - name: Doctests
        if: matrix.suite == 'full'
        run: cargo "+${{ matrix.toolchain }}" test --doc --workspace
      # MSRV leg: just prove the workspace compiles at the oldest supported
      # toolchain. (Cargo's default resolver is not MSRV-aware, so this is the
      # only guard against a dependency silently bumping the floor.)
      - name: Build (MSRV verification)
        if: matrix.suite == 'msrv'
        run: cargo "+${{ matrix.toolchain }}" build --workspace --all-targets
      # macOS debug leg (RAL-398): experimental support, so this only proves
      # the workspace builds -- no fmt/clippy/test/doctest suite, and no
      # vendored psmux (that feature is Windows-only and off by default). A
      # deeper macOS CI leg can follow once there's a real need to justify it.
      - name: Build (macOS debug smoke test)
        if: matrix.suite == 'macos-debug'
        run: cargo "+${{ matrix.toolchain }}" build --workspace --all-targets

  rust-release:
    # RAL-441: one leg per OS, gated on the whole `rust-debug` job finishing
    # green, so every OS runs its debug work before any release work starts.
    # Each leg first compiles the whole workspace in --release (covering test
    # targets too, so release-mode cfg/feature divergence is caught on the
    # PR) and then packages through the platform-appropriate product script
    # (scripts/build-release.sh on Linux/macOS, scripts/build-release.cmd on
    # Windows -- the Windows script also builds the vendored psmux submodule
    # and links it via the `embedded-tmux` feature by default, matching
    # .github/workflows/release.yml), then smoke-launches the packaged
    # binaries. The --release workspace compile is intentionally
    # feature-default (embedded-tmux is off unless the packaging step turns
    # it on), so it never needs the vendor/psmux submodule on non-Windows
    # legs.
    name: Rust release (${{ matrix.label }})
    needs: rust-debug
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
            label: ubuntu · stable · release build
            exe: ""
            packager: bash scripts/build-release.sh
            submodules: false
          - os: windows-latest
            toolchain: stable
            label: windows · stable · release build
            exe: ".exe"
            packager: cmd /c scripts\build-release.cmd
            submodules: true
          - os: macos-latest
            toolchain: stable
            label: macos · stable · release build
            exe: ""
            packager: bash scripts/build-release.sh
            submodules: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Only the Windows leg needs the vendor/psmux submodule (its
          # packaging script builds it by default); keep the other two legs'
          # checkouts thin.
          submodules: ${{ matrix.submodules }}
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            vendor/psmux -> target
      - name: Build (release, all targets)
        run: cargo "+${{ matrix.toolchain }}" build --release --workspace --all-targets
      - name: Build release package (platform packaging script)
        run: ${{ matrix.packager }}
      - name: Smoke-test release binaries
        run: ./dist/ralphus${{ matrix.exe }} --version && ./dist/ralphus-daemon${{ matrix.exe }} --version
  psmux-integration:
    name: Windows psmux integration
    runs-on: windows-latest
    env:
      # Only used by the "external tmux override" smoke test at the bottom of
      # this job -- the main suite above it runs against the vendored
      # vendor/psmux submodule build instead (RAL-347).
      PSMUX_VERSION: v3.3.8
      PSMUX_X64_SHA256: 1ad127ba937194a890b933a73d9b023e297bd73dc742abd841bf159984c2effe
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            vendor/psmux -> target
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Build vendored psmux (vendor/psmux submodule, RAL-347)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --manifest-path vendor/psmux/Cargo.toml --bin tmux
          $tmux = (Resolve-Path 'vendor/psmux/target/release/tmux.exe').Path
          $dataDir = Join-Path $env:RUNNER_TEMP "psmux-data-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $dataDir | Out-Null
          "RALPHUS_TMUX_CMD=$tmux" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PSMUX_DATA_DIR=$dataDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PSMUX_CONFIG_FILE=NUL" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify psmux installation
        shell: pwsh
        run: '& $env:RALPHUS_TMUX_CMD --version'
      # All Windows tests that touch the real, machine-wide psmux server are
      # `#[ignore]`d in the default suite and named `live_tmux_*`. Run them in
      # this isolated namespace, one at a time, for a stable per-PR signal.
      - name: Run real psmux tests serially
        run: cargo nextest run --package ralphus-daemon --lib --run-ignored only --test-threads 1 --no-tests fail --filter-expr 'test(live_tmux)'
      - name: Stop isolated psmux server
        if: always()
        continue-on-error: true
        shell: pwsh
        run: '& $env:RALPHUS_TMUX_CMD kill-server'
      # RAL-347: the vendorized build above is the default/recommended path,
      # but RALPHUS_TMUX_CMD must still let a user point at their own
      # tmux/psmux binary. This is deliberately narrow -- one fast real test
      # against a separately downloaded, non-vendorized psmux release -- not a
      # full parallel matrix of the live_tmux_* suite.
      - name: External tmux override smoke test (RALPHUS_TMUX_CMD)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP "psmux-$env:PSMUX_VERSION-windows-x64.zip"
          $installDir = Join-Path $env:RUNNER_TEMP 'psmux-external-bin'
          $url = "https://github.com/psmux/psmux/releases/download/$env:PSMUX_VERSION/psmux-$env:PSMUX_VERSION-windows-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:PSMUX_X64_SHA256) {
            throw "psmux archive checksum mismatch: expected $env:PSMUX_X64_SHA256, got $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $installDir
          $externalTmux = Get-ChildItem -LiteralPath $installDir -Filter tmux.exe -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $externalTmux) { throw 'psmux archive did not contain tmux.exe' }
          $dataDir = Join-Path $env:RUNNER_TEMP "psmux-external-data-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $dataDir | Out-Null
          $env:RALPHUS_TMUX_CMD = $externalTmux
          $env:PSMUX_DATA_DIR = $dataDir
          $env:PSMUX_CONFIG_FILE = 'NUL'
          & $externalTmux --version
          cargo nextest run --package ralphus-daemon --lib --run-ignored only --test-threads 1 --no-tests fail --filter-expr 'test(live_tmux_new_session_capture_and_kill_roundtrip)'
          & $externalTmux kill-server

  web:
    name: Web (eslint + tsc --checkJs + knip + node --test on the board chunks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+: `node --test "<glob>"` expands the pattern itself, so the test
          # script behaves identically under sh here and cmd.exe on Windows.
          node-version: "22"
      - name: Install lint deps
        run: npm install --no-audit --no-fund
      - name: ESLint (board chunk JS, incl. JSDoc coverage)
        run: npm run lint
      - name: Type-check the board chunks' JSDoc-annotated JS (tsc --checkJs)
        run: npm run typecheck
      - name: Knip (dead code / unused deps)
        run: npm run knip
      - name: Unit tests (the board's pure peek state machine)
        run: npm test

  python-lint:
    name: Python lint (ruff, mypy --strict, privata, deadcode)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli-py
    steps:
      - uses: actions/checkout@v4
      # Lint/type-check once, on the newest version cli-py/pyproject.toml's
      # `requires-python = ">=3.11"` covers -- these tools don't need a
      # version matrix, only pytest (below) does.
      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format check)
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy
      - name: privata (module privacy)
        run: |
          uv run privata src
          uv run privata tests
      - name: deadcode
        run: uv run deadcode src tests

  python-test:
    name: Python ${{ matrix.python-version }} (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli-py
    env:
      # Make every `uv` step use the matrix's interpreter, not just whatever uv
      # first finds that satisfies requires-python (>=3.11).
      UV_PYTHON: ${{ matrix.python-version }}
      # `rust-cache` can restore a release binary from an earlier commit, while
      # this job deliberately builds the debug CLI below for docsgen's tests.
      RALPHUS_CLI_BIN: ../target/debug/ralphus
    strategy:
      fail-fast: false
      matrix:
        # The versions cli-py/pyproject.toml's `requires-python = ">=3.11"` covers
        # in practice, plus a floating "3" leg that always resolves to the
        # newest available Python so CI stays forward-looking.
        python-version: ["3.11", "3.12", "3.13", "3"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
        working-directory: .
      - uses: Swatinem/rust-cache@v2
      - name: Build ralphus binary (needed by docsgen tests)
        run: cargo build -p ralphus-cli
        working-directory: .
      - name: pytest
        run: uv run pytest

  bench-patience:
    name: Bench patience comment lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check bench patience comments
        run: python scripts/check_bench_patience_comments.py

  rlog-cartographer:
    name: rlog / Cartographer pairing lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test rlog / Cartographer checker
        run: python -m unittest scripts/test_check_rlog_cartographer_pairs.py
      - name: Check daemon rlog / Cartographer pairs
        run: python scripts/check_rlog_cartographer_pairs.py
      - name: Test review settings parity checker
        run: python -m unittest scripts/test_check_review_settings_parity.py
      - name: Check review settings / TOML parity
        run: python scripts/check_review_settings_parity.py
      - name: Test project review-settings UI parity checker
        run: python -m unittest scripts/test_check_project_review_settings_ui_parity.py
      - name: Check project review-settings TOML / UI parity
        run: python scripts/check_project_review_settings_ui_parity.py

  docs:
    name: Docs (screenshot coverage lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli-py
    env:
      # Use the CLI built in this job, not a cached release artifact.
      RALPHUS_CLI_BIN: ../target/debug/ralphus
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Every board tab has a screenshot
        run: uv run ralphus-docs-lint
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
        working-directory: .
      - uses: Swatinem/rust-cache@v2
      - name: Build ralphus binary (needed by docsgen helpmap check)
        run: cargo build -p ralphus-cli
        working-directory: .
      - name: cli-reference.md help-map is up to date (RAL-110)
        run: uv run ralphus-docs-helpmap --check

[package]
name = "ralphus-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ralphus CLI: validate/submit/status/author and every board-equivalent subcommand, as a thin HTTP client over the daemon's API."

[[bin]]
name = "ralphus"
path = "src/main.rs"

[lib]
name = "ralphus_cli"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
ralphus-core = { workspace = true }
ralphus-runner = { path = "../runner" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true, features = ["tls"] }

[dev-dependencies]
tiny_http = { workspace = true }

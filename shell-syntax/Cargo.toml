[package]
name = "ralphus-shell-syntax"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ralphus shell-syntax: optional tree-sitter parse of Bash/PowerShell/cmd command text, for the board's agent log only."

[lints]
workspace = true

[features]
# Embeds tree-sitter and the Bash + PowerShell + cmd (batch) grammars (C, built with `cc`).
# Display-only and optional -- see docs/shell-syntax.md. Off: `parse` reports
# `unavailable` and nothing else changes.
parser = ["dep:tree-sitter", "dep:tree-sitter-bash", "dep:tree-sitter-powershell", "dep:tree-sitter-batch"]

[dependencies]
serde = { workspace = true }
tree-sitter = { version = "0.25", optional = true }
tree-sitter-bash = { version = "=0.25.1", optional = true }
tree-sitter-powershell = { version = "=0.26.4", optional = true }
tree-sitter-batch = { version = "=0.11.1", optional = true }

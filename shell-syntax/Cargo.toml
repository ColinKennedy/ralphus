[package]
name = "ralphus-shell-syntax"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ralphus shell-syntax: optional tree-sitter parse of Bash/PowerShell/cmd command text, for the board's agent log only."

[lints]
workspace = true

[features]
# Embeds tree-sitter and the Bash + PowerShell + cmd (batch) grammars (C, built with `cc`).
# Display-only and optional -- see docs/shell-syntax.md. Off: `parse` reports
# `unavailable` and nothing else changes.
parser = ["dep:tree-sitter", "dep:ralphus-grammars"]

[dependencies]
serde = { workspace = true }
tree-sitter = { version = "0.25", optional = true }
# The Bash/PowerShell/batch grammars: patched submodules when checked out, else crates.io.
ralphus-grammars = { path = "grammars", optional = true }

[dev-dependencies]
serde_json = { workspace = true }

site_name: ralphus
site_description: Orchestrate autonomous agent tasks with any model, verified and boarded.
docs_dir: pages
site_dir: _site

nav:
  - Why ralphus?: index.md
  - Overview: overview.md
  - Installation: installation.md
  - Views:
      - Tasks: views/tasks.md
      - Queue: views/queue.md
      - Reviews: views/reviews.md
      - Resources: views/resources.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

[package]
name = "ralphus-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ralphus daemon: authoritative task store, scheduler, and HTTP/JSON API."

[[bin]]
name = "ralphus-daemon"
path = "src/main.rs"

[lib]
name = "ralphus_daemon"
path = "src/lib.rs"

[lints]
workspace = true

[features]
secure-dist = ["ralphus-auth/secure-dist"]
# Bundles a tmux-compatible binary via `include_bytes!` so users never need to
# install tmux themselves (RAL-102). Off by default: no verified binary is
# checked in yet — see daemon/assets/tmux/windows/README.md and
# docs/tmux-embedding.md before enabling.
embedded-tmux = []

[dependencies]
ralphus-auth = { path = "../auth" }
ralphus-core.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
rusqlite = { workspace = true }
tiny_http = { workspace = true }
ureq = { workspace = true, features = ["tls"] }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
ureq = { workspace = true }

[target."cfg(windows)".dependencies]
win32job = "2.0.3"

[build-dependencies]
embed-resource = "3.0.11"

[package]
name = "ralphus-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ralphus daemon: authoritative task store, scheduler, and HTTP/JSON API."

[[bin]]
name = "ralphus-daemon"
path = "src/main.rs"

[lib]
name = "ralphus_daemon"
path = "src/lib.rs"

[lints]
workspace = true

[features]
secure-dist = ["ralphus-auth/secure-dist"]
# Bundles a tmux-compatible binary via `include_bytes!` so users never need to
# install tmux themselves, and so the daemon prefers a known-good build over
# whatever happens to be named `tmux` on PATH (RAL-102, supply-chain
# hardening in RAL-347). Off by default so a plain `cargo build` never needs
# the vendor/psmux submodule built -- run scripts/build-vendored-tmux.ps1 to
# populate daemon/assets/tmux/windows/tmux.exe before enabling. See
# docs/tmux-embedding.md.
embedded-tmux = []
# Builds and runs `tests/review_input_races.rs`, ~150 real-git scenarios that
# take ~30 minutes on a hosted runner. The test target requires this feature
# (below), so `cargo test`, `cargo nextest run`, `--all-targets` and
# `--workspace` all skip it; only naming the feature runs it. Enable it only
# on purpose: `cargo nextest run -P review-races -p ralphus-daemon --features
# race-suite`.
race-suite = []

[[test]]
name = "review_input_races"
path = "tests/review_input_races.rs"
required-features = ["race-suite"]

[dependencies]
ralphus-auth = { path = "../auth" }
ralphus-core.workspace = true
ralphus-runner = { path = "../runner" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
rusqlite = { workspace = true }
parking_lot = { workspace = true }
tiny_http = { workspace = true }
tungstenite = { workspace = true }
ureq = { workspace = true, features = ["tls"] }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
cron.workspace = true
getrandom = { workspace = true }
sha2.workspace = true

[dev-dependencies]
ureq = { workspace = true }
git2 = { workspace = true }
# `Connection::trace`, used to count the statements a store call issues.
rusqlite = { workspace = true, features = ["trace"] }

[target."cfg(windows)".dependencies]
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
win32job = "2.0.3"

[target."cfg(unix)".dependencies]
# RAL-239: killing a cancelled review's check-gate subprocess (`cargo test`,
# `npm run build`, ...) must kill its whole process tree, not just the shell
# wrapping it, or its still-running children keep the worktree busy and keep
# the output pipes open. `daemon/src/proof.rs` puts the shell in its own
# process group at spawn (`std::process::Command::process_group`, no extra
# dependency needed for that part) and, on cancel, signals the whole group
# with `kill(-pgid, SIGKILL)` -- a syscall `std` doesn't expose. `nix` wraps
# it as a safe function (same pattern as `gethostname` in the root
# `Cargo.toml`: `[workspace.lints.rust] unsafe_code = "forbid"` bans a raw
# libc call from being written in this crate, so the `unsafe` stays confined
# to the dependency instead). Windows has the equivalent problem solved via
# the `win32job` Job Object above instead.
nix = { version = "0.29", default-features = false, features = ["signal"] }

[build-dependencies]
embed-resource = "3.0.11"

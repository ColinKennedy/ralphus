# Minimal Collector pipeline for local dev (RAL-96): receive OTLP/HTTP from
# the daemon/librarian/runner, batch it, forward to Jaeger over OTLP/gRPC.
# See docs/otel-tracing.md.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlp:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]

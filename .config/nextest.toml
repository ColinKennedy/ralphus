# The review-input race suite (daemon/tests/review_input_races.rs) is ~140
# real-git scenarios (~25 CPU-minutes) and is deliberately NOT part of the
# default run: a plain `cargo nextest run [--workspace] [--all-targets]` skips
# it. It runs only under its own profile, `-P review-races` (the nightly race
# workflow, `.github/workflows/race-soak-nightly.yml`, and anyone who means to
# run it). Agents: do not run it unless asked to.
[profile.default]
default-filter = "not binary(review_input_races)"

[profile.review-races]
default-filter = "binary(review_input_races)"

# A scenario takes up to a few minutes on a slow runner; one that is still
# running after ten is hung, and fails on its own instead of holding the job
# until its timeout. The time-boxed soaks are meant to run long.
[[profile.review-races.overrides]]
filter = "binary(review_input_races) and not test(soak_)"
slow-timeout = { period = "120s", terminate-after = 5 }

[[profile.default.overrides]]
filter = "test(rapid_upstream_commits_coalesce_into_a_single_debounced_rebuild)"
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = "test(cancelling_a_review_stops_an_in_flight_feedback_agent)"
threads-required = "num-cpus"

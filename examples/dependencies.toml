# Dependency example — command sessions only, so it runs with no model.
# Change the three cwd values to a real directory on your machine
# (forward slashes on Windows).
#
# Dependency edges shown here:
#   - session -> session (same task):  make-b depends on make-a
#   - task    -> task:                 "report" depends on all of "setup"
#   - session -> session (cross-task): combine depends on "setup/make-b"

[[task]]
name = "setup"

  [[task.session]]
  id = "make-a"
  cwd = "C:/Users/korinkite/temp"
  command = "echo alpha > a.txt"

  [[task.session]]
  id = "make-b"
  cwd = "C:/Users/korinkite/temp"
  command = "type a.txt > b.txt & echo beta >> b.txt"
  depends_on = ["make-a"]                 # <-- SESSION depends on another SESSION (same task)

  [[task.verify]]
  command = "if exist b.txt (exit 0) else (exit 1)"

[[task]]
name = "report"
depends_on = ["setup"]                    # <-- TASK depends on another TASK (waits for all of setup)

  [[task.session]]
  id = "combine"
  cwd = "C:/Users/korinkite/temp"
  command = "type b.txt > report.txt"
  depends_on = ["setup/make-b"]           # <-- SESSION depends on a SESSION in another task

  [[task.verify]]
  command = "if exist report.txt (exit 0) else (exit 1)"

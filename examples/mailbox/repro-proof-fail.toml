# RAL-241 manual-verification repro: a cell whose own remediating command
# succeeds, but whose attached remediating command proof exits nonzero.
#
# The cell body succeeds on its first execution. Its proof runs all three
# configured command executions and the intervening repair passes, but the
# unconditional `exit 1` remains unsuccessful. The scheduler then broadcasts
# the proof failure through the escalation mailbox.
#
# Usage:
#   ralphus submit examples/mailbox/repro-proof-fail.toml
#   ralphus mailbox check
#   # (or, from a `ralphus quick-start watcher claude-code`/`codex` session,
#   # just wait for its next turn-boundary `ralphus mailbox check` to surface it)

[[task]]
name = "mailbox-repro-proof-fail"

[[task.cell]]
cwd = "."
command = "exit 0"
remediation_attempts = 3

[[task.cell.proof]]
command = "exit 1"
remediation_attempts = 3

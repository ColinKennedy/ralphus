[project]
name = "ralphus"
version = "0.1.0"
description = "ralphus docs tooling — screenshot generation for the docs site (docsgen)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
# Docs site build + screenshot generation (see docs/site/). Kept optional —
# a plain `uv sync` doesn't need a browser or a static-site generator.
docs = [
    "playwright>=1.45",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.scripts]
ralphus-docs-shots = "ralphus.docsgen.shots:main"
ralphus-docs-lint = "ralphus.docsgen.lint:main"
# RAL-110: regenerates the machine-readable help-map block in
# docs/cli-reference.md by shelling out to the compiled `ralphus` (Rust) binary.
ralphus-docs-helpmap = "ralphus.docsgen.helpmap_docs:main"
# RAL-94: renders bench_data/*.json (written by the Rust ralphus-bench-rs
# harness) as SVG/HTML graphs. This package no longer runs or times any test
# itself -- see docs/bench-harness.md.
ralphus-bench-graph = "ralphus.bench.graphs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ralphus"]

[dependency-groups]
dev = [
    "lapsed==3.0.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "privata==0.8.0",
    "pytest>=8",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

# playwright is the optional `docs` extra (screenshot generation only); the
# base `python` CI job runs `uv sync --dev` without it, so treat it as
# untyped rather than a hard error there too.
[[tool.mypy.overrides]]
module = "playwright.*"
ignore_missing_imports = true

[tool.deadcode]
ignore_names = [
    "do_GET",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

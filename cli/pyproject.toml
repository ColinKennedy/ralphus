[project]
name = "ralphus"
version = "0.1.0"
description = "ralphus CLI — submit and manage autonomous agent tasks against the ralphus daemon."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# The runner (Phase 1c) pulls in pydantic-ai; kept optional so the plain CLI
# stays lightweight and fast to install/package.
runner = [
    "pydantic-ai>=0.0.30",
]

[project.scripts]
ralphus = "ralphus.__main__:main"
ralphus-runner = "ralphus.runner.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ralphus"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

# pydantic-ai is the optional `runner` extra; when it is not installed (as in CI)
# treat it as untyped rather than a hard error.
[[tool.mypy.overrides]]
module = "pydantic_ai.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

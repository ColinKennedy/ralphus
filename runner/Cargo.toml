[package]
name = "ralphus-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ralphus session runner: executes one SessionSpec (command/prompt/verify) and reports a SessionResult. Spawned per-session by the daemon; speaks JSON on stdin/stdout."

[[bin]]
name = "ralphus-runner"
path = "src/main.rs"

[lib]
name = "ralphus_runner"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
ralphus-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true, features = ["tls"] }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
sha2 = { workspace = true }
sysinfo = { workspace = true }

[dev-dependencies]
ureq = { workspace = true }

[target."cfg(windows)".dependencies]
win32job = "2.0.3"

[target."cfg(unix)".dependencies]
# RAL-321: killing a `run_bash` command on timeout must kill its whole
# process tree, not just the shell wrapping it, or already-spawned
# grandchildren keep running and keep the output pipes open (the same class
# of leak `daemon/src/proof.rs` fixed for Guardian check gates under
# RAL-239). The shell is put in its own process group at spawn
# (`std::process::Command::process_group`, no extra dependency needed for
# that part) and, on timeout, the whole group is signalled with
# `kill(-pgid, SIGKILL)` -- a syscall `std` doesn't expose. `nix` wraps it as
# a safe function, since `unsafe_code = "forbid"` bans a raw libc call from
# being written in this crate. Windows has the equivalent problem solved via
# a `win32job` Job Object instead.
nix = { version = "0.29", default-features = false, features = ["signal"] }

[package]
name = "ralphus-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ralphus license verification (secure-dist feature gates the runtime check)."

[lib]
name = "ralphus_auth"
path = "src/lib.rs"

[lints]
workspace = true

[features]
secure-dist = ["dep:ed25519-dalek", "dep:base64", "dep:serde", "dep:serde_json"]

[dependencies]
ed25519-dalek = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

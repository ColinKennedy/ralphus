# RAL-414: Verify board tab performance under load

Implement deterministic integration coverage for every supported board tab's true cold-navigation, user-visible readiness. Centralize a documented 2-second default cold-load budget with a test/config override for slower CI and diagnostics. On failure report tab, fixture, budget, observed time, and available phase timings.

Add isolated representative fixtures: more than 600 worktrees for Retirements; hundreds of squads, tasks, and projects for their relevant tabs; and equivalent high-entity scenarios for other blocking tab paths. Measure navigation only after setup, from a clean browser/session state, and avoid accidental cache/reused-tab success.


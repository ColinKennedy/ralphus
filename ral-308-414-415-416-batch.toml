# RAL-308 — core/daemon/runner timeout and stall behavior.
[[task]]
name    = "RAL-308"
project = "ralphus"
agent   = "claude-code"
model   = "sonnet"

  [[task.cell]]
  id                     = "work"
  name                   = "RAL-308: work"
  cwd                    = "<<ralphus:new-worktree/RAL-308-maximum-timeout-stall-detection?upstream=staging>>"
  review                 = "<<ralphus:new-review/ral-308-414-415-416>>"
  system_prompt          = "Do NOT commit and do NOT push under any circumstances."
  system_prompt_position = "append"
  prompt                 = """
Your working directory is a git worktree checked out for this ticket's branch.

# RAL-308: Add per-task maximum_timeout and stall detection

Implement a seconds-based, hard maximum runtime for task-file tasks, cells, and proofs. A task cap is cumulative across all of its descendants; a cell cap is cumulative across that cell and its proofs; a proof cap applies to itself. At expiry, cancel/kill the running worker or tmux execution, preserve logs and completed work, reclaim resources, and record an explicit maximum-runtime failure. Existing quiet-pane stall detection stays advisory and must never kill healthy work.

The repository already has inheritable `timeout_minutes`, runner enforcement across reattach attempts, a config fallback named `maximum_timeout_seconds`, and advisory tmux-pane stall mailbox escalation. Reuse and reconcile those mechanisms rather than creating competing timeout paths. Ensure process termination uses safe kill/wait/pipe-draining behavior and does not strand locks.

Add task-file schema support and `ralphus tutor` documentation. Before adding any `core/src/validate.rs` rule for the new field, stop and obtain the required user decision on validation semantics: whether it accepts only positive seconds with omission meaning no cap, or whether zero is accepted as unbounded. Do not infer that policy from this prompt. If no answer is available through the task's normal interaction channel, report the precise blocked decision rather than adding validation behavior.

Add a conservative daemon periodic stall sweep that recognizes a still-running proof/cell with no CPU-time progress over repeated samples across several minutes and emits an additive RAL-241 escalation-mailbox notification. Do not auto-kill from the stall detector. Keep platform-specific CPU accounting behind an appropriate abstraction.

Acceptance criteria:
- Task/cell/proof maximum runtime is enforced as a hard cap and reported clearly.
- Negative values are rejected with a line-numbered validation error once the user has chosen the numeric policy.
- `ralphus tutor` explains the field, seconds unit, and valid placement.
- Repeated CPU-flat samples produce a mailbox escalation without changing kill behavior.
- Add focused tests; run relevant format, lint, and test checks.
"""

    [[task.cell.proof]]
    id     = "fmt"
    model  = "haiku"
    prompt = "Run `cargo fmt --all -- --check`. If it fails, run `cargo fmt --all`, then re-run the check. Do NOT commit or push. End with `RALPHUS_PROOF: PASS` only if it passes."

    [[task.cell.proof]]
    id     = "clippy"
    model  = "haiku"
    prompt = "Run `cargo clippy --all-targets -- -D warnings`. If it fails, fix only issues caused by this task and re-run. Do NOT commit or push. End with `RALPHUS_PROOF: PASS` only if it passes."

    [[task.cell.proof]]
    id     = "test"
    model  = "haiku"
    prompt = "Run focused core, daemon, and runner tests for this change. Do not run `cargo test --all-targets` or `cargo nextest run --all-targets`, because this dogfooding environment can lock daemon/librarian executables. Use `cargo nextest run -p ralphus-daemon --lib` for daemon coverage. Do NOT commit or push. End with `RALPHUS_PROOF: PASS` only if all selected tests pass."

  [[task.cell]]
  id                     = "finalize"
  name                   = "RAL-308: finalize"
  cwd                    = "<<ralphus:new-worktree/RAL-308-maximum-timeout-stall-detection?upstream=staging>>"
  depends_on             = ["work"]
  system_prompt          = "Stage only relevant source files, commit them, and push the commit if a remote exists. Do not run checks."
  system_prompt_position = "append"
  prompt                 = "Stage only relevant source files, commit them, and push the commit if a remote exists."

